<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="G検定（JDLA Deep Learning for GENERAL）対策のオリジナル問題190問、時間制限つき模擬試験、要点整理、用語集。">
<meta property="og:title" content="G検定 模試ラボ">
<meta property="og:description" content="最近の出題傾向に合わせたオリジナル問題で腕試し。9分野190問・模擬試験・要点整理・用語集。">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
<title>G検定 模試ラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F4F6F4; --surface:#FFFFFF; --surface-2:#EAEFEC; --surface-3:#DCE4DF;
  --ink:#16211C; --ink-2:#465650; --ink-3:#74847D; --line:#D5DDD8; --line-2:#C0CCC5;
  --accent:#0E7A6B; --accent-ink:#FFFFFF; --accent-soft:#DDF0EA; --accent-line:#9FD2C6;
  --amber:#B8730F; --amber-soft:#FBEFD8;
  --good:#237A4E; --good-soft:#DCF2E4;
  --bad:#B93A32; --bad-soft:#FAE3E0;
  --shadow:0 1px 2px rgba(20,40,30,.06), 0 10px 28px -14px rgba(20,40,30,.22);
  --font-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif;
  --font-display:"BIZ UDPMincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101614; --surface:#171F1C; --surface-2:#1F2925; --surface-3:#29352F;
    --ink:#E6ECE8; --ink-2:#B1BDB6; --ink-3:#7C8983; --line:#2A3631; --line-2:#3A4841;
    --accent:#5FC9B4; --accent-ink:#08201B; --accent-soft:#173630; --accent-line:#2E6A5D;
    --amber:#E5B25E; --amber-soft:#3B3018;
    --good:#6FCF97; --good-soft:#1A3527;
    --bad:#F08C82; --bad-soft:#42221F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#171F1C; --surface-2:#1F2925; --surface-3:#29352F;
  --ink:#E6ECE8; --ink-2:#B1BDB6; --ink-3:#7C8983; --line:#2A3631; --line-2:#3A4841;
  --accent:#5FC9B4; --accent-ink:#08201B; --accent-soft:#173630; --accent-line:#2E6A5D;
  --amber:#E5B25E; --amber-soft:#3B3018;
  --good:#6FCF97; --good-soft:#1A3527;
  --bad:#F08C82; --bad-soft:#42221F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.75}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr .in{max-width:1000px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:22px;height:56px}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand .k{font-family:var(--font-display);font-size:20px;letter-spacing:.02em}
.brand .s{font-size:11px;color:var(--ink-3);letter-spacing:.08em}
.tabs{display:flex;gap:2px;margin-left:auto;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs a{padding:6px 12px;border-radius:7px;text-decoration:none;color:var(--ink-2);font-weight:700;font-size:13.5px;white-space:nowrap}
.tabs a:hover{background:var(--surface-2);color:var(--ink)}
.tabs a.on{background:var(--accent-soft);color:var(--accent)}
main{max-width:1000px;margin:0 auto;padding:28px 20px 80px}
.ftr{max-width:1000px;margin:0 auto;padding:0 20px 40px;font-size:12.5px;color:var(--ink-3);line-height:1.7;border-top:1px solid var(--line);padding-top:16px}

/* ---------- common ---------- */
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-h h1{font-family:var(--font-display);font-size:28px;line-height:1.25;font-weight:400}
.page-h p{margin:6px 0 0;color:var(--ink-2);max-width:60ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:700;line-height:1.3;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn[disabled]{opacity:.45;cursor:default}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;line-height:1.6;background:var(--surface-2);color:var(--ink-2)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.muted{color:var(--ink-3)}
.bar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar i.good{background:var(--good)} .bar i.amber{background:var(--amber)}
select.sel,input.inp{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;width:100%}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3)}
.note{font-size:12.5px;color:var(--ink-3);line-height:1.6}
.sec{padding:18px 20px}
.sec h2{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line-2);border-radius:4px;padding:0 5px;color:var(--ink-3);background:var(--surface)}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:stretch;margin-bottom:18px}
.hero .lead{padding:26px 28px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.hero h1{font-family:var(--font-display);font-size:32px;line-height:1.25;font-weight:400}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:0;color:var(--ink-2);max-width:52ch}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.stats{display:grid;grid-template-rows:repeat(3,1fr);gap:10px}
.stat{padding:14px 18px;display:flex;flex-direction:column;gap:6px;justify-content:center}
.stat .lab{font-size:12.5px;color:var(--ink-2);font-weight:700;display:flex;justify-content:space-between}
.stat .val{font-family:var(--font-mono);font-size:24px;line-height:1.1}
.stat .val small{font-size:12px;color:var(--ink-3);font-family:var(--font-body);margin-left:4px}
.share{display:flex;flex-direction:column;gap:8px}
.share .row{display:grid;grid-template-columns:150px 1fr 42px;gap:10px;align-items:center;font-size:13.5px}
.share .row .r{text-align:right;color:var(--ink-2)}
.fmt{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.fmt .row{display:grid;grid-template-columns:1fr 46px;gap:10px;align-items:center;font-size:13.5px}
.fmt .row .bar{margin-top:4px}
.themes{margin:0;padding:0;list-style:none;columns:2;column-gap:22px;font-size:13.5px}
.themes li{break-inside:avoid;padding:4px 0 4px 14px;position:relative;color:var(--ink-2)}
.themes li::before{content:"";position:absolute;left:0;top:13px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.catlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.catlist a{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 16px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);background:var(--surface)}
.catlist a:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.catlist a b{font-weight:700}
.catlist a .d{grid-column:1/-1;font-size:12.5px;color:var(--ink-3);line-height:1.5}
.catlist a .n{font-family:var(--font-mono);font-size:12px;color:var(--accent);align-self:start}
.catlist a .bar{grid-column:1/-1;margin-top:2px}

/* ---------- practice / mock ---------- */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:18px}
.mode{padding:16px 18px;text-align:left;display:flex;flex-direction:column;gap:6px}
.mode:hover{border-color:var(--accent-line)}
.mode b{font-weight:700;font-size:15px}
.mode span{font-size:12.5px;color:var(--ink-3)}
.mode .cnt{font-family:var(--font-mono);font-size:12px;color:var(--accent)}
.mode.mock{background:var(--accent-soft);border-color:var(--accent-line)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:5px}
.qgrid button{height:30px;border-radius:6px;font-family:var(--font-mono);font-size:11px;background:var(--surface-2);color:var(--ink-2);border:1px solid transparent}
.qgrid button.ok{background:var(--good-soft);color:var(--good)}
.qgrid button.ng{background:var(--bad-soft);color:var(--bad)}
.qgrid button:hover{border-color:var(--ink-3)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink-3);margin-bottom:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--surface-3)}
.legend i.ok{background:var(--good)} .legend i.ng{background:var(--bad)}
.run{max-width:780px;margin:0 auto}
.run .top{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.run .top .bar{flex:1;min-width:120px;max-width:260px}
.timer{font-family:var(--font-mono);font-size:15px;font-weight:600;padding:3px 10px;border-radius:6px;background:var(--surface-2);margin-left:auto}
.timer.low{background:var(--amber-soft);color:var(--amber)}
.qcard{padding:24px 28px}
.qcard .qh{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.qcard .qn{font-family:var(--font-mono);color:var(--ink-3);font-size:13px}
.qcard .qt{font-size:16px;line-height:1.8;white-space:pre-line;margin-bottom:18px}
.qcard .qt b{color:var(--bad);font-weight:700}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:11px 14px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);text-align:left;line-height:1.65;transition:background .12s,border-color .12s}
.choice .m{font-family:var(--font-mono);color:var(--ink-3);font-size:12px;font-weight:600;width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;margin-top:1px}
.choice:hover{border-color:var(--accent);background:var(--accent-soft)}
.choice[disabled]{cursor:default}
.choice[disabled]:hover{background:var(--surface);border-color:var(--line-2)}
.choice.correct,.choice.correct[disabled]:hover{background:var(--good-soft);border-color:var(--good)}
.choice.correct .m{color:var(--good);font-weight:700}
.choice.wrong,.choice.wrong[disabled]:hover{background:var(--bad-soft);border-color:var(--bad)}
.choice.wrong .m{color:var(--bad);font-weight:700}
.choice.picked,.choice.picked[disabled]:hover{background:var(--accent-soft);border-color:var(--accent)}
.exp{margin-top:18px;padding:14px 16px;border-radius:8px;background:var(--surface-2);border-left:3px solid var(--accent)}
.exp .r{font-weight:700;margin-bottom:4px}
.exp .r.ok{color:var(--good)} .exp .r.ng{color:var(--bad)}
.exp p{margin:0;font-size:14px;line-height:1.75}
.run .actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.result{padding:26px 28px}
.result .big{font-family:var(--font-mono);font-size:46px;line-height:1;margin:6px 0 6px}
.result .big small{font-size:16px;color:var(--ink-3);font-family:var(--font-body)}
.result .rows{margin:14px 0 0;display:flex;flex-direction:column;gap:6px}
.result .rows a{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:7px;text-decoration:none;color:var(--ink);font-size:13.5px;background:var(--surface-2)}
.result .rows a .t{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hist{display:flex;flex-direction:column;gap:6px}
.hist .row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;font-size:13.5px;padding:6px 0;border-bottom:1px dashed var(--line)}
.hist .row:last-child{border-bottom:0}

/* ---------- notes ---------- */
.notes{display:grid;grid-template-columns:220px minmax(0,1fr);gap:26px;align-items:start}
.ntoc{position:sticky;top:72px;display:flex;flex-direction:column;gap:2px}
.ntoc a{padding:7px 10px;border-radius:7px;text-decoration:none;color:var(--ink-2);font-size:13.5px;font-weight:700}
.ntoc a:hover{background:var(--surface-2)}
.ntoc a.on{background:var(--accent-soft);color:var(--accent)}
.nsel{display:none;margin-bottom:14px}
.narticle{max-width:74ch}
.narticle .head{padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.narticle h1{font-family:var(--font-display);font-size:26px;font-weight:400;line-height:1.3}
.narticle h2{font-size:17px;margin:26px 0 8px;font-weight:700;padding-left:12px;border-left:3px solid var(--accent)}
.narticle ul{margin:0;padding-left:1.3em}
.narticle li{margin:6px 0}
.narticle .go{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap}

/* ---------- terms ---------- */
.ttools{display:grid;grid-template-columns:1fr 220px auto;gap:10px;margin-bottom:16px}
.tlist{display:flex;flex-direction:column;gap:8px}
.term{padding:12px 16px}
.term summary{cursor:pointer;font-weight:700;display:flex;align-items:center;gap:10px;list-style:none}
.term summary::-webkit-details-marker{display:none}
.term summary .pill{margin-left:auto;font-weight:400}
.term p{margin:8px 0 0;color:var(--ink-2);font-size:14px}
.fc{max-width:640px;margin:0 auto}
.fcard{padding:0;overflow:hidden;box-shadow:var(--shadow)}
.fcard .t{padding:28px 28px 20px;border-bottom:1px dashed var(--line-2)}
.fcard .t h2{font-family:var(--font-display);font-size:28px;font-weight:400;line-height:1.3}
.fcard .d{padding:22px 28px 26px;min-height:130px;font-size:15px;line-height:1.8}
.fcard .d.hide{color:transparent;user-select:none;background:repeating-linear-gradient(135deg,var(--surface-2) 0 8px,var(--surface-3) 8px 16px)}
.fc-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
.fc-actions .btn{padding:12px}
.fc-actions .btn.still{border-color:var(--bad);color:var(--bad)}
.fc-actions .btn.got{border-color:var(--good);color:var(--good)}
.fc-nav{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;color:var(--ink-3)}

@media (prefers-reduced-motion: reduce){ .choice{transition:none} }
@media (max-width: 820px){
  .hdr .in{gap:12px;height:auto;flex-wrap:wrap;padding:10px 14px}
  .tabs{margin-left:0;width:100%}
  main{padding:18px 14px 70px}
  .hero{grid-template-columns:1fr}
  .stats{grid-template-rows:none;grid-template-columns:repeat(3,1fr)}
  .grid2{grid-template-columns:1fr}
  .themes{columns:1}
  .share .row{grid-template-columns:110px 1fr 40px}
  .notes{grid-template-columns:1fr}
  .ntoc{display:none}
  .nsel{display:block}
  .ttools{grid-template-columns:1fr}
  .qcard{padding:18px 16px}
  .hero h1{font-size:26px}
  .page-h h1{font-size:24px}
}
@media (max-width: 480px){ .stats{grid-template-columns:1fr} }
</style>
</head>
<body>

<header class="hdr"><div class="in">
  <a class="brand" href="#/"><span class="k">G検定 模試ラボ</span><span class="s">ORIGINAL PRACTICE</span></a>
  <nav class="tabs" id="tabs"></nav>
</div></header>

<script>const DATA = {"cats":[{"id":"ai","name":"人工知能とは・動向","desc":"AIの定義と歴史、探索・推論、知識表現、AI分野の難問"},{"id":"ml","name":"機械学習の手法","desc":"教師あり・なし学習の代表手法、評価指標、過学習対策"},{"id":"math","name":"数理・統計","desc":"確率分布、推定、線形代数、微分、情報量"},{"id":"dl","name":"ディープラーニングの基礎","desc":"ニューラルネットの仕組み、活性化関数、最適化、正則化"},{"id":"cv","name":"画像認識","desc":"CNN、代表モデル、物体検出・セグメンテーション、データ拡張"},{"id":"nlp","name":"自然言語・音声","desc":"単語埋め込み、RNN、Transformer、BERT/GPT、LLM、音声処理"},{"id":"gen","name":"生成モデル・強化学習","desc":"GAN、VAE、拡散モデル、Q学習、DQN、方策勾配、RLHF"},{"id":"biz","name":"AIの社会実装","desc":"プロジェクトの進め方、PoC、MLOps、データ収集、モデル運用"},{"id":"law","name":"法律・倫理","desc":"個人情報保護法、著作権、不正競争防止法、AI規制、公平性・透明性"}],"questions":[{"id":"ai-b06d06","cat":"ai","q":"「人工知能（Artificial Intelligence）」という言葉が初めて使われた場として、最も適切な選択肢を1つ選べ。","c":["1956年のダートマス会議","1966年のELIZA発表講演","1997年のディープブルー対局","2012年のILSVRC"],"a":0,"e":"1956年、ジョン・マッカーシーらが開催したダートマス会議の提案書で「人工知能」という語が初めて使われた。ILSVRCは画像認識コンペ、ディープブルーはチェス専用機。","neg":false},{"id":"ai-1d8934","cat":"ai","q":"第2次AIブーム（1980年代）の中心となった技術として、最も適切な選択肢を1つ選べ。","c":["迷路やパズルを解く探索アルゴリズム","専門家の知識をルールとして蓄えたエキスパートシステム","大量データから特徴量を自動学習するディープラーニング","対訳コーパスを用いた統計的機械翻訳"],"a":1,"e":"第1次は探索・推論、第2次は知識（エキスパートシステム）、第3次は機械学習・ディープラーニングの時代と整理される。","neg":false},{"id":"ai-6c91d3","cat":"ai","q":"幅優先探索と深さ優先探索の比較として、最も不適切な選択肢を1つ選べ。","c":["幅優先探索は、解が存在すれば最短ステップの解を必ず見つけられる","幅優先探索は探索途中のノードを多く記憶するため、メモリ消費が大きくなりやすい","深さ優先探索は行けるところまで進んで戻るため、メモリ消費が比較的小さい","深さ優先探索は最初に見つけた解が常に最短の解になる"],"a":3,"e":"深さ優先探索は先に見つかった解が最短とは限らない。最短解の保証があるのは幅優先探索で、その代わりメモリを多く使う。","neg":true},{"id":"ai-621a7b","cat":"ai","q":"フレーム問題の説明として、最も適切な選択肢を1つ選べ。","c":["記号（言葉）とそれが指す実世界の対象を結びつけることが難しいという問題","会話だけでは機械に知能があるかどうか判定できないという問題","ある課題を遂行するとき、それに関係のある事柄だけを選び出して考慮することが難しいという問題","探索すべき状態の数が指数関数的に増えて計算しきれなくなるという問題"],"a":2,"e":"フレーム問題は1969年にマッカーシーとヘイズが提唱。デネットの爆弾とロボットの例え話で知られ、いまも本質的には未解決。1は記号接地問題、4は組合せ爆発。","neg":false},{"id":"ai-acb36e","cat":"ai","q":"シンボルグラウンディング問題（記号接地問題）の説明として、最も適切な選択肢を1つ選べ。","c":["知識ベースの構築に必要な専門家の知識を引き出すことが難しい問題","「シマウマ」という記号を、実際のシマウマの姿や概念と結びつけられるかという問題","AIの判断根拠を人間が理解できないという問題","学習データの偏りがそのまま出力に反映されてしまう問題"],"a":1,"e":"ハルナッドが提起した問題。人間は身体を通じて概念を獲得しているため、身体性アプローチの重要性が指摘される。1は知識獲得のボトルネック、3はブラックボックス問題。","neg":false},{"id":"ai-d7f599","cat":"ai","q":"「中国語の部屋」という思考実験を提示した人物として、最も適切な選択肢を1つ選べ。","c":["アラン・チューリング","ジョン・サール","マービン・ミンスキー","ダニエル・デネット"],"a":1,"e":"哲学者ジョン・サールは、規則書に従って中国語の応答ができても理解しているとは言えないと主張し、「強いAI」への批判として中国語の部屋を提示した。","neg":false},{"id":"ai-c6aaa7","cat":"ai","q":"1966年に開発された対話プログラム ELIZA の説明として、最も適切な選択肢を1つ選べ。","c":["入力文のパターンに応じて定型的に応答するだけだが、利用者に人間らしさを感じさせた","大規模なコーパスから統計的に応答を生成した最初の言語モデルである","チューリングテストに正式に合格した最初のプログラムである","音声認識と音声合成を組み合わせた最初の対話システムである"],"a":0,"e":"ワイゼンバウムが開発したELIZAは精神科医のような相づちを返す単純な仕組みだったが、多くの人が感情移入した。ここから「ELIZA効果」という言葉が生まれた。","neg":false},{"id":"ai-dd4aa5","cat":"ai","q":"ゲーム木探索におけるαβ法（アルファベータ法）の説明として、最も適切な選択肢を1つ選べ。","c":["終局までランダムに何度もプレイして勝率で局面を評価する","深さ優先探索の一種で、常に最も評価の高い手だけを1本読む","Mini-Max法の探索で、結果に影響しないと判明した枝を読まずに打ち切って効率化する","盤面の画像をCNNで評価して次の一手を決める"],"a":2,"e":"αβ法はMini-Max法の枝刈り手法。αカット・βカットにより評価値が変わらない部分木を省略し、同じ結果をより少ない計算で得る。1はモンテカルロ法。","neg":false},{"id":"ai-0ce580","cat":"ai","q":"モンテカルロ木探索の特徴として、最も適切な選択肢を1つ選べ。","c":["すべての局面を評価関数で厳密に採点する","人間が設計した評価関数を必要とし、囲碁には適用できない","探索木を作らず、1手先のみを見て手を決める","有望な手を選んで終局までランダムにプレイアウトし、その勝率で局面の良し悪しを評価する"],"a":3,"e":"モンテカルロ木探索は評価関数を人手で設計しにくい囲碁で有効だった。AlphaGoはこれにディープラーニングの方策・価値ネットワークを組み合わせた。","neg":false},{"id":"ai-6e422d","cat":"ai","q":"意味ネットワークにおける「is-a」と「part-of」の関係の説明として、最も適切な選択肢を1つ選べ。","c":["is-aは上位・下位概念の関係で推移律が成り立つが、part-ofは全体と部分の関係で推移律が常に成り立つとは限らない","is-aは全体と部分の関係、part-ofは上位・下位概念の関係を表す","is-aとpart-ofはどちらも推移律が成り立たない","is-aとpart-ofは同じ関係の別名である"],"a":0,"e":"「ペンギン is-a 鳥」「鳥 is-a 動物」なら「ペンギン is-a 動物」が成り立つ。part-ofには複数の種類があり、推移律が成り立たない例がある。","neg":false},{"id":"ai-f39ca9","cat":"ai","q":"オントロジー構築における「ライトウェイトオントロジー」の説明として、最も適切な選択肢を1つ選べ。","c":["哲学的な考察に基づき、概念の意味や関係を厳密に定義する","専門家が手作業で長期間かけて構築する常識知識ベースである","Webデータなどから半自動的に構築し、厳密さより効率や実用性を重視する","推論規則をすべて論理式で記述する"],"a":2,"e":"ヘビーウェイトオントロジーは厳密性を重視し人手で作る。ライトウェイトはWebマイニングなどで半自動的に構築し、検索やレコメンドに活用される。","neg":false},{"id":"ai-33593e","cat":"ai","q":"Cycプロジェクトの説明として、最も適切な選択肢を1つ選べ。","c":["東京大学合格を目指すAIの開発プロジェクト","人間の一般常識をすべて知識ベースとして記述しようとする長期プロジェクト","囲碁AIの開発プロジェクト","画像認識の精度を競う国際コンペティション"],"a":1,"e":"1984年にダグラス・レナートが開始。常識をコンピュータに与えるために膨大な知識を人手で記述し続けており、知識獲得の難しさを示す例でもある。","neg":false},{"id":"ai-ecdc23","cat":"ai","q":"エキスパートシステムにおける「知識獲得のボトルネック」の説明として、最も適切な選択肢を1つ選べ。","c":["専門家の暗黙的な知識を引き出し、矛盾なくルールとして記述することが難しい","推論エンジンの計算速度が遅く、実用に耐えない","知識ベースが大きくなるとメモリが不足する","利用者がシステムの操作方法を習得できない"],"a":0,"e":"MYCINなどのエキスパートシステムは有用だったが、知識をルール化する作業は人手に頼り、量が増えると保守も困難になった。これが第2次AIブーム終息の一因。","neg":false},{"id":"ai-5c1df1","cat":"ai","q":"IBMのワトソンに関する記述として、最も不適切な選択肢を1つ選べ。","c":["2011年にクイズ番組「ジョパディ！」で人間のチャンピオンに勝利した","質問応答（Question Answering）の技術を用いている","質問文の意味を人間と同じように理解して答えている","Wikipediaなどの大量の文書から関連する情報を高速に検索して回答候補を作る"],"a":2,"e":"ワトソンは意味を理解しているわけではなく、質問中のキーワードに関連する情報を検索し、確からしさを評価して回答している。","neg":true},{"id":"ai-1ef3ba","cat":"ai","q":"「東ロボくん」プロジェクトの説明として、最も適切な選択肢を1つ選べ。","c":["東京大学が開発した囲碁AI","国立情報学研究所が中心となり大学入試での合格を目指した人工知能プロジェクトで、読解力（意味理解）に課題が残り2016年に凍結された","東京都が導入した行政手続きの自動化AI","IBMが日本向けに開発した質問応答システム"],"a":1,"e":"東ロボくんは偏差値57程度に達したが、文章の意味理解を要する問題が壁となった。記号接地問題の現実的な例としてよく引かれる。","neg":false},{"id":"ai-ab478e","cat":"ai","q":"ELIZA効果の説明として、最も適切な選択肢を1つ選べ。","c":["AIの原理が分かると「単なる自動化で知能ではない」と感じる心理","AIが人間の仕事を奪うという不安","AIが学習データの偏りを増幅する現象","単純な応答しかしないプログラムに対して、人間らしい意図や感情があるように感じてしまう心理"],"a":3,"e":"1はAI効果。ELIZA効果はチャットボットや音声アシスタントに対しても起こる。","neg":false},{"id":"ai-10a25c","cat":"ai","q":"シンギュラリティ（技術的特異点）に関する記述として、最も適切な選択肢を1つ選べ。","c":["レイ・カーツワイルは2045年にシンギュラリティが到来すると予測した","シンギュラリティとは第1次AIブームが終わった時点を指す","ジョン・マッカーシーが1956年に提唱した概念である","すでに2012年のILSVRCで到達したとされる"],"a":0,"e":"カーツワイルは「2029年にAIが人間の知能を超え、2045年にシンギュラリティが起こる」と予測した。AIが自らより賢いAIを作り、技術進歩が予測不能になる転換点を指す。","neg":false},{"id":"ai-2a1d1f","cat":"ai","q":"ロボットの行動計画（プランニング）で用いられるSTRIPSの説明として、最も適切な選択肢を1つ選べ。","c":["ロボットの関節をニューラルネットで制御する手法","ランダムに行動して報酬を最大化する手法","「前提条件」「行動」「結果」の組で世界の状態変化を記述し、目標状態に至る行動列を求める手法","画像から物体の位置を検出する手法"],"a":2,"e":"STRIPSは1971年に提案された古典的プランニングの枠組み。積み木の世界（SHRDLU）などとともに第1次AIブーム期の代表的成果。","neg":false},{"id":"ai-535de0","cat":"ai","q":"機械翻訳の歴史に関する記述として、最も不適切な選択肢を1つ選べ。","c":["ルールベース機械翻訳は、人手で作成した文法規則と辞書を用いる","統計的機械翻訳は、人手で作成した文法規則を用いて翻訳確率を計算する","ニューラル機械翻訳は、エンコーダ・デコーダ型のニューラルネットで文全体を変換する","ニューラル機械翻訳の登場で翻訳品質が大きく向上した"],"a":1,"e":"統計的機械翻訳は大量の対訳コーパスから翻訳確率を統計的に学習する手法で、文法規則を人手で書く必要がない点がルールベースとの違い。","neg":true},{"id":"ai-512968","cat":"ai","q":"人工知能をレベル1〜4に分類したとき、「機械学習を取り入れた人工知能（レベル3）」の例として、最も適切な選択肢を1つ選べ。","c":["温度に応じて出力を変えるエアコンの制御","決められたルールで盤面を評価するチェスプログラム","大量の検索履歴から関連度を学習する検索エンジン","特徴量そのものを自動で学習する画像認識システム"],"a":2,"e":"レベル1は単純制御、レベル2は探索・推論・知識ベースの古典的AI、レベル3はサンプルデータから関係を学ぶ機械学習、レベル4は特徴量まで学習するディープラーニング。","neg":false},{"id":"ml-23f63c","cat":"ml","q":"次のうち、教師あり学習に該当しない手法として、最も適切な選択肢を1つ選べ。","c":["ロジスティック回帰","サポートベクターマシン","ランダムフォレスト","k-means法"],"a":3,"e":"k-means法は正解ラベルを使わずにデータをクラスタに分ける教師なし学習。他の3つは正解ラベル付きデータから学習する。","neg":true},{"id":"ml-0993be","cat":"ml","q":"線形回帰における最小二乗法の説明として、最も適切な選択肢を1つ選べ。","c":["予測値と実測値の差の絶対値の合計を最小にする","予測値と実測値の差の二乗の合計を最小にする係数を求める","係数の二乗和を最小にする","予測値の分散を最大にする"],"a":1,"e":"残差平方和（RSS）を最小化する。二乗にすることで正負が打ち消されず、微分しやすい。1は最小絶対値法、3は正則化の考え方。","neg":false},{"id":"ml-27124c","cat":"ml","q":"ロジスティック回帰の説明として、最も適切な選択肢を1つ選べ。","c":["線形結合をシグモイド関数に通して、あるクラスに属する確率を出力する二値分類モデル","目的変数が連続値の回帰問題にのみ用いる","決定木を多数組み合わせたアンサンブル手法","距離が近いデータの多数決でクラスを決める"],"a":0,"e":"「回帰」と名がつくが分類に使う。出力を閾値（例えば0.5）で区切ってクラスを判定し、多クラスにはソフトマックス回帰で拡張する。","neg":false},{"id":"ml-124558","cat":"ml","q":"サポートベクターマシン（SVM）に関する記述として、最も適切な選択肢を1つ選べ。","c":["各クラスの平均に近い方に分類する","データの密度が高い領域をクラスタとして抽出する","マージンを最大化する境界を求め、カーネル関数で高次元空間に写像すれば非線形な分離もできる","決定木の分岐を情報利得で決める"],"a":2,"e":"SVMは境界に最も近いデータ（サポートベクター）との距離＝マージンを最大化する。カーネルトリックにより高次元での内積を効率よく計算できる。","neg":false},{"id":"ml-eadc92","cat":"ml","q":"決定木に関する記述として、最も不適切な選択肢を1つ選べ。","c":["分岐の条件を人が読めるため、解釈しやすい","特徴量を事前に標準化しないと正しく学習できない","深くしすぎると過学習しやすい","分岐の基準として情報利得やジニ不純度が使われる"],"a":1,"e":"決定木は特徴量の大小関係で分岐するため、スケール変換の影響を受けない。標準化が必要なのはSVMやk近傍法、ニューラルネットなど距離や勾配を使う手法。","neg":true},{"id":"ml-b87447","cat":"ml","q":"ランダムフォレストの説明として、最も適切な選択肢を1つ選べ。","c":["1本の決定木を非常に深く成長させる手法","前の木の誤差を次の木で補正していく手法","線形回帰にL2正則化を加えた手法","ブートストラップサンプリングした複数のデータと、ランダムに選んだ特徴量で多数の決定木を作り、多数決や平均で予測する手法"],"a":3,"e":"バギング（並列に学習）に特徴量のランダム選択を加えたもの。木どうしの相関を下げ、分散を減らして汎化性能を高める。2はブースティング。","neg":false},{"id":"ml-164253","cat":"ml","q":"AdaBoost の学習の進め方として、最も適切な選択肢を1つ選べ。","c":["前の弱学習器が誤分類したデータの重みを大きくし、次の弱学習器がそれを重点的に学ぶ","すべての弱学習器を同時に独立に学習し、平均をとる","学習データをランダムに半分に分けて別々のモデルを作る","特徴量を主成分に変換してから学習する"],"a":0,"e":"ブースティングは逐次的にモデルを追加して誤りを補正する。AdaBoostはデータの重み、勾配ブースティングは残差（勾配）に着目する。","neg":false},{"id":"ml-5757e7","cat":"ml","q":"勾配ブースティング（XGBoost、LightGBMなど）の説明として、最も適切な選択肢を1つ選べ。","c":["多数の決定木を独立に学習して多数決する","確率的勾配降下法でニューラルネットを学習する","現在のモデルの予測誤差（損失関数の勾配）を小さくするような決定木を逐次追加していく","サポートベクターの数を増やしながら学習する"],"a":2,"e":"勾配ブースティング決定木（GBDT）は表形式データのコンペで非常に強い手法。木を1本ずつ追加し、それまでの誤りを補正する方向に学習する。","neg":false},{"id":"ml-6da11a","cat":"ml","q":"k近傍法（k-NN）に関する記述として、最も適切な選択肢を1つ選べ。","c":["学習時にパラメータを最適化するため、推論は高速である","kを小さくしすぎるとノイズの影響を受けやすく過学習しやすい","距離の定義は結果に影響しない","教師なし学習の代表的手法である"],"a":1,"e":"k-NNは学習時にほぼ何もせず、推論時に近いk個のラベルで多数決する（怠惰学習）。kが小さいと局所のノイズに引きずられ、大きいと境界が滑らかになる。","neg":false},{"id":"ml-19b0da","cat":"ml","q":"L1正則化（ラッソ）の特徴として、最も適切な選択肢を1つ選べ。","c":["一部の係数がちょうど0になりやすく、特徴選択の効果がある","すべての係数を均等に小さくするが0にはならない","係数の二乗和をペナルティに加える","正則化項を加えると必ず学習データへの当てはまりが良くなる"],"a":0,"e":"L1はパラメータの絶対値の和、L2（リッジ）は二乗和をペナルティとする。L1はスパースな解を与え、L2は係数を全体的に縮小する。","neg":false},{"id":"ml-14295a","cat":"ml","q":"ホールドアウト法とk-分割交差検証に関する記述として、最も不適切な選択肢を1つ選べ。","c":["ホールドアウト法は、データを学習用と検証用に一度だけ分割して評価する","k-分割交差検証は、分割を変えてk回学習・評価し、その平均で性能を見積もる","k-分割交差検証は、ホールドアウト法より計算コストが小さい","データが少ない場合、k-分割交差検証のほうが評価が安定しやすい"],"a":2,"e":"k-分割交差検証はk回学習するため計算コストはk倍程度になる。その代わり分割の偶然による評価のぶれを抑えられる。","neg":true},{"id":"ml-f974a8","cat":"ml","q":"混同行列を用いた「適合率（Precision）」の定義として、最も適切な選択肢を1つ選べ。","c":["実際に陽性のもののうち、陽性と予測できた割合","陽性と予測したもののうち、実際に陽性だった割合","全データのうち、予測が当たった割合","適合率と再現率の調和平均"],"a":1,"e":"適合率 = TP/(TP+FP)。1は再現率 TP/(TP+FN)、3は正解率、4はF値。","neg":false},{"id":"ml-65a9fc","cat":"ml","q":"再現率（Recall）を特に重視すべき場面として、最も適切な選択肢を1つ選べ。","c":["迷惑メールを誤って重要メールと判定しても問題ない場合","不要な広告を表示するコストが高い場合","検索結果の上位に無関係な文書が混ざることを避けたい場合","重い病気のスクリーニングで、見逃し（偽陰性）を最小限にしたい場合"],"a":3,"e":"再現率は「実際の陽性をどれだけ拾えたか」。見逃しのコストが大きい場面で重視する。誤検出のコストが大きい場面では適合率を重視する。","neg":false},{"id":"ml-859c41","cat":"ml","q":"ROC曲線とAUCに関する記述として、最も適切な選択肢を1つ選べ。","c":["AUCは1に近いほど分類性能が高く、0.5はランダムな分類と同等である","ROC曲線は横軸に再現率、縦軸に適合率をとる","AUCは回帰問題の評価指標である","AUCが0.5のモデルは完全な分類器である"],"a":0,"e":"ROC曲線は横軸に偽陽性率、縦軸に真陽性率（再現率）をとり、閾値を変えながら描く。2はPR曲線。","neg":false},{"id":"ml-041e4b","cat":"ml","q":"過学習を抑える対策として、最も不適切な選択肢を1つ選べ。","c":["学習データを増やす","正則化項を加える","モデルのパラメータ数を増やして表現力を高める","検証データの誤差が増え始めたら学習を止める（早期終了）"],"a":2,"e":"表現力を上げると学習データにさらに適合し、過学習は悪化しやすい。データ拡張・正則化・ドロップアウト・早期終了・モデルの単純化が基本的な対策。","neg":true},{"id":"ml-042b64","cat":"ml","q":"k-means法に関する記述として、最も不適切な選択肢を1つ選べ。","c":["各データを最も近い重心のクラスタに割り当て、重心を更新する処理を繰り返す","クラスタ数kはアルゴリズムが自動的に決定する","初期値によって結果が変わることがある","エルボー法などでkの目安を決めることがある"],"a":1,"e":"kは人が事前に指定するハイパーパラメータ。初期重心の選び方を工夫したk-means++もよく使われる。","neg":true},{"id":"ml-8d5e18","cat":"ml","q":"階層的クラスタリングの説明として、最も適切な選択肢を1つ選べ。","c":["あらかじめ決めたk個の重心に基づいてクラスタを作る","確率分布の混合としてデータをモデル化する","データを2次元に埋め込んで可視化する","近いクラスタ同士を順に併合していき、結果を樹形図（デンドログラム）で表す"],"a":3,"e":"ウォード法などの併合基準で最も近いクラスタを順に結合する。デンドログラムを任意の高さで切ることでクラスタ数を後から決められる。","neg":false},{"id":"ml-2eb135","cat":"ml","q":"主成分分析（PCA）における「寄与率」の説明として、最も適切な選択肢を1つ選べ。","c":["各主成分がデータ全体の分散のうちどれだけを説明しているかの割合","各特徴量が目的変数に与える影響の大きさ","クラスタ内の分散とクラスタ間の分散の比","主成分の個数"],"a":0,"e":"第1主成分から順に寄与率が大きい。累積寄与率が例えば80〜90%になる主成分数を採用するのが目安。","neg":false},{"id":"ml-de6cbb","cat":"ml","q":"t-SNEの説明として、最も適切な選択肢を1つ選べ。","c":["線形変換で分散が最大の方向を求める次元削減手法","時系列データの予測手法","高次元データの局所的な近さを保ちながら2〜3次元に埋め込み、可視化に用いる手法","決定木の枝刈り手法"],"a":2,"e":"t-SNEは非線形な次元削減で、可視化に特化している。距離の絶対値やクラスタ間の距離は保たれないため、解釈には注意が必要。","neg":false},{"id":"ml-66d39f","cat":"ml","q":"レコメンドシステムにおける「コールドスタート問題」の説明として、最も適切な選択肢を1つ選べ。","c":["サーバの起動に時間がかかる問題","新しいユーザーや新しい商品には履歴データがなく、協調フィルタリングで推薦が難しい問題","人気商品ばかりが推薦される問題","推薦結果の説明ができない問題"],"a":1,"e":"対策として、商品の属性情報を使うコンテンツベースフィルタリングとの組み合わせ（ハイブリッド）や、初期アンケートの活用がある。","neg":false},{"id":"ml-05213a","cat":"ml","q":"クラス不均衡データ（陽性1%、陰性99%など）への対応として、最も不適切な選択肢を1つ選べ。","c":["少数派クラスをオーバーサンプリングする（SMOTEなど）","多数派クラスをアンダーサンプリングする","正解率ではなく、F値やAUCなどで評価する","多数派クラスをさらに増やして学習の安定性を高める"],"a":3,"e":"多数派を増やすと不均衡が悪化し、すべて陰性と答えるだけで高い正解率が出るモデルになりやすい。","neg":true},{"id":"ml-1fa6a2","cat":"ml","q":"自己教師あり学習の説明として、最も適切な選択肢を1つ選べ。","c":["人手でラベル付けしたデータのみで学習する","報酬を最大化するように行動を学習する","ラベルのないデータから、入力の一部を隠して予測するなどの疑似タスクを作り、表現を学習する","少量のラベル付きデータと大量のラベルなしデータを併用する"],"a":2,"e":"BERTのマスク予測やSimCLRの対比学習が代表例。4は半教師あり学習の説明。","neg":false},{"id":"math-543639","cat":"math","q":"ベイズの定理に関する記述として、最も適切な選択肢を1つ選べ。","c":["事前確率は観測データから計算される","事後確率は、尤度と事前確率の積に比例する","尤度は常に1以下の確率である必要がある","ベイズの定理は独立な事象にしか適用できない"],"a":1,"e":"P(θ|D) = P(D|θ)P(θ)/P(D)。観測前の信念（事前確率）をデータ（尤度）で更新して事後確率を得る。","neg":false},{"id":"math-12b2d1","cat":"math","q":"正規分布に関する記述として、最も適切な選択肢を1つ選べ。","c":["平均±1標準偏差の範囲に全体の約68%のデータが含まれる","平均と中央値は常に異なる","分布の形は平均だけで決まる","値は0以上に限られる"],"a":0,"e":"正規分布は平均μと標準偏差σで決まる左右対称の分布。±1σに約68%、±2σに約95%、±3σに約99.7%が含まれる。","neg":false},{"id":"math-6e011e","cat":"math","q":"ポアソン分布が適しているデータとして、最も適切な選択肢を1つ選べ。","c":["コイン投げ10回の表の回数","身長の分布","1時間あたりにコールセンターへかかってくる電話の件数","サイコロの目"],"a":2,"e":"ポアソン分布は一定時間・空間内で稀な事象が起こる回数のモデル。1は二項分布、2は正規分布、4は離散一様分布。","neg":false},{"id":"math-3816c4","cat":"math","q":"最尤推定の説明として、最も適切な選択肢を1つ選べ。","c":["パラメータの事前分布と事後分布が一致するように推定する","予測値と実測値の差の絶対値を最小にする","推定量の分散を最小にする","観測されたデータが得られる確率（尤度）が最大になるようにパラメータを決める"],"a":3,"e":"尤度を対数にした対数尤度を最大化することが多い。正規分布を仮定した回帰の最尤推定は最小二乗法と一致する。","neg":false},{"id":"math-2781fc","cat":"math","q":"相関係数に関する記述として、最も不適切な選択肢を1つ選べ。","c":["相関係数は−1から1の値をとる","相関係数が高ければ、一方が他方の原因であると言える","相関係数が0に近くても、非線形な関係が存在することがある","外れ値によって相関係数は大きく変わることがある"],"a":1,"e":"相関は因果を意味しない。第三の変数（交絡因子）による疑似相関の可能性を常に考える必要がある。","neg":true},{"id":"math-52873f","cat":"math","q":"分散と標準偏差の関係として、最も適切な選択肢を1つ選べ。","c":["標準偏差は分散の正の平方根である","分散は標準偏差の平方根である","分散と標準偏差は常に等しい","標準偏差は分散の2倍である"],"a":0,"e":"分散は偏差の二乗の平均で単位が元の二乗になるため、平方根をとった標準偏差が元データと同じ単位で散らばりを表す。","neg":false},{"id":"math-e06f86","cat":"math","q":"3×4の行列Aと4×2の行列Bの積ABのサイズとして、最も適切な選択肢を1つ選べ。","c":["4×4","3×4","3×2","計算できない"],"a":2,"e":"行列積は(m×n)(n×p) = (m×p)。左の列数と右の行数が一致する必要があり、結果は左の行数×右の列数。","neg":false},{"id":"math-5002de","cat":"math","q":"勾配降下法におけるパラメータの更新式として、最も適切な選択肢を1つ選べ（ηは学習率、∇Lは損失の勾配）。","c":["w ← w + η∇L","w ← w − η∇L","w ← w × η∇L","w ← ∇L / η"],"a":1,"e":"損失を減らすには勾配の逆方向に進む。学習率ηは1回の更新でどれだけ進むかを決めるハイパーパラメータ。","neg":false},{"id":"math-246df1","cat":"math","q":"2つの事象AとBが独立であることの定義として、最も適切な選択肢を1つ選べ。","c":["P(A∪B) = P(A) + P(B)","P(A|B) = 0","AとBが同時に起こらない","P(A∩B) = P(A)P(B)"],"a":3,"e":"独立なら一方の生起が他方の確率に影響しない、つまりP(A|B) = P(A)。1と3は排反事象に関する記述。","neg":false},{"id":"math-e63fb3","cat":"math","q":"情報量（自己情報量）に関する記述として、最も適切な選択肢を1つ選べ。","c":["生起確率が低い事象ほど、それが起きたときの情報量は大きい","生起確率が高い事象ほど情報量は大きい","情報量は確率に比例する","エントロピーは確定した事象ほど大きい"],"a":0,"e":"自己情報量は −log p で定義される。エントロピーは情報量の期待値で、不確実性が大きい（各事象が等確率に近い）ほど大きい。","neg":false},{"id":"math-bc7f7c","cat":"math","q":"KLダイバージェンスに関する記述として、最も不適切な選択肢を1つ選べ。","c":["2つの確率分布の違いを測る指標である","値は0以上で、2つの分布が等しいときに0になる","対称性があり、距離の公理をすべて満たす","VAEの損失関数などで用いられる"],"a":2,"e":"KL(P‖Q) と KL(Q‖P) は一般に等しくないため距離ではない。対称化したものにJSダイバージェンスがある。","neg":true},{"id":"math-62b6fa","cat":"math","q":"中心極限定理の説明として、最も適切な選択肢を1つ選べ。","c":["どんなデータもサンプル数を増やせば正規分布になる","母集団の分布によらず、標本平均の分布はサンプルサイズが大きくなると正規分布に近づく","標本の分散は常に母分散に等しい","平均と中央値は一致する"],"a":1,"e":"個々のデータの分布が正規でなくても、標本平均は近似的に正規分布に従う。統計的推測の基礎となる定理。","neg":false},{"id":"math-61e83a","cat":"math","q":"特徴量の「標準化（standardization）」の説明として、最も適切な選択肢を1つ選べ。","c":["最小値を0、最大値を1に変換する","対数をとって分布の歪みを小さくする","カテゴリ変数を0/1のベクトルに変換する","平均を0、標準偏差を1に変換する"],"a":3,"e":"1はmin-max正規化、3はone-hotエンコーディング。標準化は外れ値の影響をmin-maxより受けにくい。","neg":false},{"id":"math-fde64f","cat":"math","q":"分類問題の損失関数として交差エントロピー誤差が用いられる理由として、最も適切な選択肢を1つ選べ。","c":["予測した確率分布と正解の分布の違いを測り、確率出力のモデルと相性が良く勾配も安定するため","回帰問題でも同じ式が使えるため","計算が最も軽いため","外れ値の影響を受けないため"],"a":0,"e":"ソフトマックス出力と交差エントロピーの組み合わせは勾配が「予測確率−正解」と単純になり学習しやすい。回帰には平均二乗誤差などを使う。","neg":false},{"id":"math-e24504","cat":"math","q":"ベクトルのL2ノルムの説明として、最も適切な選択肢を1つ選べ。","c":["各要素の絶対値の和","各要素の最大値","各要素の二乗和の平方根（ユークリッド距離）","要素の個数"],"a":2,"e":"L1ノルムは絶対値の和（マンハッタン距離）、L2ノルムはユークリッド距離。正則化のL1/L2はこれらのノルムに対応する。","neg":false},{"id":"math-c9b972","cat":"math","q":"主成分分析と固有値・固有ベクトルの関係として、最も適切な選択肢を1つ選べ。","c":["主成分は目的変数との相関が最大になる方向である","データの共分散行列の固有ベクトルが主成分の方向で、対応する固有値がその方向の分散を表す","固有値が小さい方向ほど重要な主成分である","主成分分析は固有値を用いない"],"a":1,"e":"固有値の大きい順に第1、第2主成分となる。特異値分解（SVD）でも同等の計算ができる。","neg":false},{"id":"dl-a1fb4c","cat":"dl","q":"単純パーセプトロンの限界として、最も適切な選択肢を1つ選べ。","c":["学習に時間がかかりすぎる","多クラス分類ができない","XORのように線形分離できない問題を解けない","連続値を出力できない"],"a":2,"e":"ミンスキーとパパートが1969年に指摘し、第1次ニューラルネットブームが冷え込む一因となった。隠れ層を加えた多層パーセプトロンで解決できる。","neg":false},{"id":"dl-d6b5ff","cat":"dl","q":"誤差逆伝播法の説明として、最も適切な選択肢を1つ選べ。","c":["出力層で計算した誤差を、微分の連鎖律を使って入力側へ順に伝え、各層の重みの勾配を求める","入力層から出力層へ信号を伝えて予測値を計算する","重みをランダムに変えて誤差が減った場合のみ採用する","各層を1層ずつ独立に事前学習する"],"a":0,"e":"順伝播で予測と誤差を求め、逆伝播で勾配を計算し、勾配降下法で重みを更新する。これがニューラルネット学習の基本サイクル。","neg":false},{"id":"dl-90f2c9","cat":"dl","q":"シグモイド関数を隠れ層に使うと勾配消失が起きやすい理由として、最も適切な選択肢を1つ選べ。","c":["出力が負の値をとらないため","微分の最大値が0.25と小さく、層を重ねるほど勾配が掛け算で小さくなるため","計算量が大きいため","出力が発散するため"],"a":1,"e":"誤差逆伝播では各層の活性化関数の微分が掛け合わされる。1未満の値を何度も掛けると入力層付近の勾配がほぼ0になる。","neg":false},{"id":"dl-5fcb0d","cat":"dl","q":"ReLU関数の利点として、最も適切な選択肢を1つ選べ。","c":["出力が−1から1の範囲に収まる","すべての入力に対して微分が可能である","出力の合計が1になり確率として解釈できる","正の入力に対して微分が1になるため勾配消失が起きにくく、計算も軽い"],"a":3,"e":"ReLU = max(0, x)。負の領域で勾配が0になる「死んだReLU」の問題があり、Leaky ReLUなどの派生がある。","neg":false},{"id":"dl-e8ed6d","cat":"dl","q":"出力層の活性化関数の組み合わせとして、最も不適切な選択肢を1つ選べ。","c":["二値分類 ― シグモイド関数","多クラス分類 ― ソフトマックス関数","回帰 ― ソフトマックス関数","回帰 ― 恒等関数"],"a":2,"e":"回帰では出力をそのまま（恒等関数）使う。ソフトマックスは合計1の確率分布を出力するため多クラス分類用。","neg":true},{"id":"dl-01306b","cat":"dl","q":"ミニバッチ学習の説明として、最も適切な選択肢を1つ選べ。","c":["データを小さなまとまりに分け、その単位で勾配を計算して重みを更新する","すべての学習データで勾配を計算してから1回だけ更新する","1つのデータごとに必ず更新する","学習データを毎回ランダムに半分捨てる"],"a":0,"e":"バッチ学習（全データ）と確率的勾配降下法（1件ずつ）の中間で、GPUの並列計算と学習の安定性のバランスが良い。","neg":false},{"id":"dl-970e9f","cat":"dl","q":"最適化手法Adamの説明として、最も適切な選択肢を1つ選べ。","c":["学習率を固定して単純に勾配方向に更新する","モーメンタム（勾配の移動平均）と、勾配の二乗の移動平均による学習率の調整を組み合わせた手法","学習率を毎エポック半分にする手法","二次微分（ヘッセ行列）を用いるニュートン法の一種"],"a":1,"e":"SGD→モーメンタム→AdaGrad→RMSProp→Adamと発展。Adamは多くのタスクで安定して使える標準的な選択肢。","neg":false},{"id":"dl-3f0d01","cat":"dl","q":"学習率が大きすぎる場合に起こりやすい現象として、最も適切な選択肢を1つ選べ。","c":["学習が非常にゆっくり進む","必ず局所最適解に収束する","過学習が起こる","損失が振動したり発散したりして収束しない"],"a":3,"e":"学習率が大きいと最適解を飛び越えてしまう。小さすぎると収束が遅い。学習率スケジューリングやウォームアップで調整する。","neg":false},{"id":"dl-56a923","cat":"dl","q":"モーメンタムを用いた最適化の利点として、最も適切な選択肢を1つ選べ。","c":["学習率を自動的に0にする","パラメータ数を削減できる","過去の勾配方向を慣性として加えることで、振動を抑え、鞍点や浅い局所解を抜けやすくする","学習データの偏りを補正する"],"a":2,"e":"谷底で行ったり来たりする振動を抑え、一定方向には加速する。ボールが坂を転がるイメージ。","neg":false},{"id":"dl-f6ac54","cat":"dl","q":"ドロップアウトの説明として、最も適切な選択肢を1つ選べ。","c":["学習時にランダムに一部のニューロンを無効化し、複数のネットワークを平均するような効果で過学習を抑える","学習率を段階的に下げる","重みの絶対値の和にペナルティを課す","学習データの一部を検証用に取り分ける"],"a":0,"e":"推論時はすべてのニューロンを使う（出力をスケーリング）。全結合層で特に効果があり、アンサンブル学習に似た効果を持つ。","neg":false},{"id":"dl-09ca37","cat":"dl","q":"早期終了（early stopping）の説明として、最も適切な選択肢を1つ選べ。","c":["学習データの誤差が0になったら学習を止める","検証データの誤差が悪化し始めた時点で学習を打ち切り、過学習を防ぐ","学習率が0になったら学習を止める","エポック数を必ず10以下にする"],"a":1,"e":"学習を続けると学習誤差は下がり続けるが、検証誤差はある時点から上昇に転じる。その手前で止めるのが早期終了。","neg":false},{"id":"dl-12783e","cat":"dl","q":"バッチ正規化の説明として、最も適切な選択肢を1つ選べ。","c":["入力画像の画素値を0〜1に変換する処理","学習前にデータ全体を標準化する処理","重みの大きさにペナルティを課す処理","各層の出力をミニバッチ単位で平均0・分散1に正規化し、学習を安定させ高速化する処理"],"a":3,"e":"内部共変量シフトへの対処として2015年に提案。学習率を大きくでき、初期値への依存を減らし、正則化に似た効果もある。","neg":false},{"id":"dl-2cbdd1","cat":"dl","q":"重みの初期化手法に関する記述として、最も適切な選択肢を1つ選べ。","c":["すべての重みを0で初期化するのが最も安全である","Xavierの初期値はReLU専用である","Heの初期値はReLUを用いる層に適しており、Xavierの初期値はシグモイドやtanhに適している","初期値は学習結果に影響しない"],"a":2,"e":"全て0にすると全ニューロンが同じ勾配を持ち学習が進まない。活性化関数に応じて分散を調整するのがXavier/Heの考え方。","neg":false},{"id":"dl-1455d7","cat":"dl","q":"ヒントンらが2006年に提案した、ディープラーニング初期の学習手法として、最も適切な選択肢を1つ選べ。","c":["制限付きボルツマンマシンを層ごとに事前学習して積み重ねる深層信念ネットワーク（DBN）","Transformerによる自己注意機構","残差接続による超深層ネットワーク","敵対的生成ネットワーク"],"a":0,"e":"層ごとの貪欲な事前学習で勾配消失を回避した。同時期に積層オートエンコーダも用いられ、その後ReLUやバッチ正規化で事前学習なしの学習が主流になった。","neg":false},{"id":"dl-890342","cat":"dl","q":"データリーケージ（リーク）の説明として、最も適切な選択肢を1つ選べ。","c":["学習中にメモリが不足する現象","本来学習時に使えないはずのテストデータや未来の情報が学習に混入し、評価が不当に良くなる現象","モデルのパラメータが外部に流出する事故","GPUの計算資源が足りなくなる問題"],"a":1,"e":"例：前処理の標準化をテストデータも含めて行う、同一患者の画像が学習とテストの両方に入る、など。運用時に精度が急落する典型的な原因。","neg":false},{"id":"dl-17adfc","cat":"dl","q":"「内部共変量シフト」への直接的な対処として提案された手法は、最も適切な選択肢を1つ選べ。","c":["ドロップアウト","データ拡張","早期終了","バッチ正規化"],"a":3,"e":"学習が進むにつれ各層の入力分布が変わる現象を内部共変量シフトと呼び、バッチ正規化はこれを抑える目的で提案された。","neg":false},{"id":"dl-bf5d4f","cat":"dl","q":"TPUの説明として、最も適切な選択肢を1つ選べ。","c":["Intelが開発した汎用CPU","画像描画のために開発された汎用のグラフィック処理装置","Googleがディープラーニングのテンソル演算向けに開発した専用プロセッサ","スマートフォン向けの省電力CPU"],"a":2,"e":"TPU（Tensor Processing Unit）は行列演算を低精度で高速に処理する。GPUは元来グラフィック用だが並列計算に強くディープラーニングで広く使われる。","neg":false},{"id":"dl-7c722e","cat":"dl","q":"ハイパーパラメータの探索手法に関する記述として、最も適切な選択肢を1つ選べ。","c":["ベイズ最適化は、これまでの評価結果をもとに次に試す候補を決めるため、グリッドサーチより少ない試行で良い値を見つけやすい","グリッドサーチはランダムサーチより常に効率が良い","ハイパーパラメータは学習データから誤差逆伝播で自動的に決まる","学習率はハイパーパラメータではない"],"a":0,"e":"ハイパーパラメータ（学習率、層数、バッチサイズなど）は学習では決まらないため探索が必要。ランダムサーチは重要なパラメータが少数のとき効率的。","neg":false},{"id":"dl-9ae207","cat":"dl","q":"勾配爆発への対策として、最も適切な選択肢を1つ選べ。","c":["層を増やす","勾配のノルムが閾値を超えたら縮小する勾配クリッピング","学習率を大きくする","活性化関数をシグモイドに変える"],"a":1,"e":"RNNの学習で特に問題になる。勾配クリッピングのほか、適切な初期化や正規化も有効。","neg":false},{"id":"dl-8939d4","cat":"dl","q":"オートエンコーダの説明として、最も適切な選択肢を1つ選べ。","c":["入力と異なるクラスラベルを出力するように学習する","2つのネットワークを競わせて学習する","報酬を最大化する行動を学習する","入力をそのまま再現するように学習し、中間層（潜在表現）に圧縮された特徴を得る"],"a":3,"e":"エンコーダで圧縮しデコーダで復元する。次元削減、ノイズ除去、異常検知（再構成誤差の大きさ）などに使われる。","neg":false},{"id":"dl-7ed658","cat":"dl","q":"入力層784ユニット、隠れ層100ユニット（バイアスあり）の全結合層のパラメータ数として、最も適切な選択肢を1つ選べ。","c":["78,400","78,500","88,400","7,850"],"a":1,"e":"重みは784×100 = 78,400、バイアスは出力ユニット数の100。合計78,500。","neg":false},{"id":"cv-418ba4","cat":"cv","q":"畳み込み層の役割として、最も適切な選択肢を1つ選べ。","c":["特徴マップのサイズを半分に縮小する","すべての画素を1列に並べて全結合する","小さなフィルタを画像上でずらしながら適用し、エッジや模様などの局所的な特徴を抽出する","画像の画素値を0〜1に正規化する"],"a":2,"e":"同じフィルタを画像全体で使い回す（重み共有）ため、全結合層よりパラメータが少なく、位置のずれにも強い。","neg":false},{"id":"cv-428141","cat":"cv","q":"32×32の入力画像に5×5のフィルタを、パディングなし・ストライド1で畳み込んだときの出力サイズとして、最も適切な選択肢を1つ選べ。","c":["28×28","30×30","32×32","27×27"],"a":0,"e":"出力サイズ = (入力 − フィルタ + 2×パディング)/ストライド + 1 = (32 − 5 + 0)/1 + 1 = 28。","neg":false},{"id":"cv-250574","cat":"cv","q":"パディングの目的として、最も適切な選択肢を1つ選べ。","c":["学習を高速化するために画像を縮小する","画像の周囲を0などで埋め、端の情報を保ちつつ出力サイズを調整する","画像を回転させてデータを増やす","フィルタの数を減らす"],"a":1,"e":"パディングなしでは畳み込みのたびに画像が小さくなり、端の画素はフィルタが当たる回数が少ない。","neg":false},{"id":"cv-d85bb1","cat":"cv","q":"プーリング層に関する記述として、最も不適切な選択肢を1つ選べ。","c":["特徴マップを縮小し、計算量を減らす","小さな位置ずれに対する頑健性を高める","最大値プーリングや平均値プーリングがある","畳み込み層と同様に、学習によって更新される重みを持つ"],"a":3,"e":"プーリングは決まった演算（最大値や平均）を取るだけで、学習パラメータを持たない。","neg":true},{"id":"cv-453fef","cat":"cv","q":"2012年のILSVRCで優勝したAlexNetの特徴として、最も適切な選択肢を1つ選べ。","c":["残差接続を導入して152層を実現した","3×3のフィルタのみを使用した","ReLU、ドロップアウト、GPUによる学習を活用し、従来手法を大差で上回った","Inceptionモジュールを導入した"],"a":2,"e":"AlexNetはディープラーニングが画像認識で圧倒的な性能を示した転換点。1はResNet、2はVGG、4はGoogLeNet。","neg":false},{"id":"cv-310840","cat":"cv","q":"VGGNetの特徴として、最も適切な選択肢を1つ選べ。","c":["3×3の小さなフィルタを重ねて深くしたシンプルな構造","複数サイズの畳み込みを並列に行うモジュールを積層","残差接続を導入","深さ方向と点方向に畳み込みを分離"],"a":0,"e":"大きなフィルタ1つより小さなフィルタを複数重ねる方がパラメータが少なく非線形性も増える。VGG16、VGG19が有名。","neg":false},{"id":"cv-10624b","cat":"cv","q":"GoogLeNetの特徴として、最も適切な選択肢を1つ選べ。","c":["8層の浅いネットワーク","1×1、3×3、5×5の畳み込みとプーリングを並列に適用するInceptionモジュールを積層した","全結合層のみで構成","学習時にランダムに層をスキップする"],"a":1,"e":"1×1畳み込みでチャネル数を削減して計算量を抑えた。補助的な出力（auxiliary classifier）を途中に設けた点も特徴。","neg":false},{"id":"cv-34af04","cat":"cv","q":"ResNetの残差接続（スキップ結合）の効果として、最も適切な選択肢を1つ選べ。","c":["パラメータ数を大幅に削減する","画像サイズを維持する","学習データを増やす","入力をそのまま先の層へ足し込むことで勾配が伝わりやすくなり、非常に深いネットワークでも学習できる"],"a":3,"e":"層を深くすると精度が下がる劣化問題を解決した。恒等写像を学びやすくする構造で、152層でILSVRC 2015を制した。","neg":false},{"id":"cv-ea2217","cat":"cv","q":"MobileNetで用いられ、計算量を大幅に削減する畳み込みとして、最も適切な選択肢を1つ選べ。","c":["Dilated Convolution","Transposed Convolution","Depthwise Separable Convolution","3D Convolution"],"a":2,"e":"チャネルごとの空間畳み込み（Depthwise）と1×1のチャネル方向畳み込み（Pointwise）に分解し、計算量とパラメータを約1/8〜1/9に減らす。","neg":false},{"id":"cv-1e801c","cat":"c やC2PAなど）、法制度やリテラシー教育を組み合わせる"],"a":3,"e":"名誉毀損、詐欺、選挙妨害などに悪用されうる。生成側のガードレールと受け手側の検証の両面が必要。","neg":false},{"id":"law-b0217c","cat":"law","q":"自動運転のレベル分けにおけるレベル3の説明として、最も適切な選択肢を1つ選べ。","c":["すべての運転操作を常に人間が行う","特定の条件下でシステムが運転操作を行うが、システムの要請時には人間が運転を引き継ぐ必要がある","あらゆる条件下でシステムが運転し、人間は一切関与しない","ハンドル操作のみを支援する"],"a":1,"e":"レベル0〜5の6段階。日本では2020年の道路交通法改正でレベル3、2023年にレベル4（特定条件下の完全自動運転）が解禁された。","neg":false},{"id":"law-2c1ebb","cat":"law","q":"AI導入と労働に関する記述として、最も不適切な選択肢を1つ選べ。","c":["AI導入で業務内容が変わる従業員には、リスキリングの機会を提供することが望ましい","従業員の行動をAIでモニタリングする場合、目的や範囲を事前に説明せず秘密裏に行う方が混乱がなくてよい","AIは人間の判断を補助するツールとして活用し、最終判断の責任の所在を明確にする","AIによって新たに生まれる業務もある"],"a":1,"e":"従業員のモニタリングは労働者のプライバシーに関わるため、目的・方法の事前説明と必要最小限の実施が求められる。","neg":true},{"id":"law-838ae7","cat":"law","q":"独占禁止法の観点から問題となる可能性が最も高い事例として、最も適切な選択肢を1つ選べ。","c":["競合他社が同じ価格設定AIを使い、結果として価格が同時に引き上げられる状態が事実上の協調（カルテル）になる場合","自社の販売データをAIで分析して独自に価格を決める場合","AIで在庫を最適化してコストを下げる場合","AIで顧客に商品を推薦する場合"],"a":0,"e":"アルゴリズムによる価格調整が競争を制限する「デジタルカルテル」は各国の競争当局が注視している。","neg":false},{"id":"law-261a55","cat":"law","q":"AIが自律的に生み出した発明の特許に関する記述として、最も適切な選択肢を1つ選べ。","c":["AIを発明者として特許出願できる国が大多数である","AIが関与した発明は一切特許を受けられない","AIが関与すると発明者の記載は不要になる","日本を含む多くの国では、発明者は自然人（人間）である必要があるとされている"],"a":3,"e":"「DABUS」をめぐる各国の訴訟で、AIを発明者と認めない判断が相次いだ。AIを道具として使った人間が発明者となりうる。","neg":false},{"id":"law-3842fe","cat":"law","q":"顔認証システムのために人の顔画像を収集・利用する際の配慮として、最も適切な選択肢を1つ選べ。","c":["顔画像は個人情報ではないので配慮は不要","顔画像は個人識別符号を含む個人情報に当たるため、利用目的の特定・通知や適切な取得が必要で、肖像権やプライバシーにも配慮する","公共の場で撮影した画像は自由に商用利用できる","本人が写っていれば同意は不要"],"a":1,"e":"特に監視目的の顔認証は社会的な懸念が大きく、EU AI Actでも厳しく規制されている。","neg":false},{"id":"law-952333","cat":"law","q":"個人データを外国の第三者に提供する場合の記述として、最も適切な選択肢を1つ選べ。","c":["国内への提供と全く同じ扱いでよい","外国への提供は一切できない","原則として本人の同意が必要で、例外として十分性認定を受けた国への提供や、相当措置を講じている第三者への提供などがある","クラウドを使えば規制の対象外になる"],"a":2,"e":"提供先の国名や制度についての情報提供義務もある。クラウドサービスの利用も提供に当たる場合がある。","neg":false},{"id":"law-cec448","cat":"law","q":"敵対的サンプル（adversarial example）の説明として、最も適切な選択肢を1つ選べ。","c":["入力に人間には気づきにくい微小なノイズを加えることで、モデルに誤った判断をさせる攻撃用のデータ","GANの学習に使う本物のデータ","ラベルを間違えて付けたデータ","学習データに含まれる外れ値"],"a":0,"e":"標識にシールを貼って誤認識させる例が有名。自動運転や顔認証のセキュリティ上のリスクとなる。","neg":false},{"id":"law-b72509","cat":"law","q":"各国・国際機関のAI倫理原則に共通して含まれる項目として、最も不適切な選択肢を1つ選べ。","c":["公平性・非差別","透明性・説明責任","プライバシーの保護","利益の最大化"],"a":3,"e":"OECDのAI原則、EUの倫理ガイドライン、日本の人間中心のAI社会原則などは、人間中心・公平性・透明性・安全性・プライバシー・アカウンタビリティを共通に掲げる。","neg":true}],"notes":{"ai":[{"h":"AIの定義と分類","b":["「人工知能」は1956年のダートマス会議（マッカーシーが命名）で研究分野として誕生。統一された定義はない。","レベル分類：①単純制御 ②探索・推論・知識ベースの古典的AI ③機械学習 ④特徴量まで学ぶディープラーニング。","強いAI／弱いAI（サール）、汎用型／特化型。現在実用化されているのはほぼ特化型。","AI効果＝仕組みが分かると知能と思わなくなる心理。ELIZA効果＝単純な応答に人間らしさを感じる心理。"]},{"h":"3つのブームと冬の時代","b":["第1次（1950年代後半〜60年代）：探索・推論。迷路・パズルなどトイプロブレムは解けたが現実問題は解けず冬へ。","第2次（1980年代）：知識。エキスパートシステム（MYCIN、DENDRAL）、第五世代コンピュータ計画。知識獲得のボトルネックで冬へ。","第3次（2010年代〜）：機械学習・特徴表現学習。2012年ILSVRCでAlexNet、2016年AlphaGo。生成AIで第4次と呼ぶ論もある。"]},{"h":"探索・推論と知識表現","b":["幅優先＝最短解を保証・メモリ大／深さ優先＝メモリ小・最短保証なし。","ゲーム木：Mini-Max法 → αβ法で枝刈り → モンテカルロ木探索（ランダムプレイアウトの勝率で評価）。","プランニング：STRIPS（前提条件・行動・結果）。SHRDLU（積み木の世界）。","知識表現：意味ネットワーク（is-a は推移律あり、part-of は場合による）、オントロジー（ヘビーウェイト＝厳密・人手／ライトウェイト＝半自動・実用重視）、Cyc（常識の知識ベース）。","ワトソン（質問応答、Jeopardy!）、東ロボくん（意味理解の壁で凍結）。"]},{"h":"AI分野の難問","b":["フレーム問題（マッカーシー＆ヘイズ、1969）：関係あることだけを選び出す難しさ。デネットの爆弾ロボット。","シンボルグラウンディング問題（ハルナッド）：記号と実世界の意味の結びつき。身体性アプローチ。","チューリングテスト／ローブナーコンテスト、中国語の部屋（サール）による反論。","シンギュラリティ（カーツワイル：2045年）。機械翻訳はルールベース→統計的→ニューラルへ。"]}],"ml":[{"h":"学習の種類","b":["教師あり（回帰・分類）、教師なし（クラスタリング・次元削減）、強化学習（報酬）。","半教師あり＝少量ラベル＋大量ラベルなし。自己教師あり＝データ自身から疑似タスクを作る（BERTのマスク予測など）。"]},{"h":"代表的な教師あり手法","b":["線形回帰（最小二乗法）、リッジ（L2）・ラッソ（L1、スパース）・ElasticNet。","ロジスティック回帰：シグモイドで確率を出力する分類。多クラスはソフトマックス。","SVM：マージン最大化、カーネルトリックで非線形分離。決定木：解釈しやすいが過学習しやすく、スケーリング不要。","アンサンブル：バギング（並列・分散を減らす、ランダムフォレスト）／ブースティング（逐次・誤りを補正、AdaBoost・勾配ブースティング）／スタッキング。","k近傍法：学習は怠惰、kが小さいと過学習。ナイーブベイズ：特徴の条件付き独立を仮定、テキスト分類に強い。"]},{"h":"教師なし手法","b":["k-means（kは人が指定、初期値依存、エルボー法）、階層的クラスタリング（デンドログラム、ウォード法）、DBSCAN（密度ベース）。","PCA（分散最大の方向、寄与率、固有ベクトル）、SVD、t-SNE／UMAP（可視化向け、非線形）。","協調フィルタリング（コールドスタート問題）、コンテンツベースフィルタリング、トピックモデル（LDA）。"]},{"h":"評価と検証","b":["ホールドアウト法／k-分割交差検証（計算k倍、評価が安定）／時系列は時間順に分割。","混同行列：正解率、適合率 TP/(TP+FP)、再現率 TP/(TP+FN)、F値（調和平均）。見逃しコスト大→再現率、誤検知コスト大→適合率。","ROC曲線（偽陽性率×真陽性率）とAUC（0.5＝ランダム、1＝完全）。回帰はMSE・RMSE・MAE・決定係数R²。","過学習対策：データ追加・拡張、正則化、ドロップアウト、早期終了、モデル単純化。バイアス（単純すぎ）とバリアンス（複雑すぎ）のトレードオフ。","不均衡データ：オーバー／アンダーサンプリング（SMOTE）、評価指標の選び直し。"]}],"math":[{"h":"確率と分布","b":["条件付き確率、独立 P(A∩B)=P(A)P(B)、ベイズの定理（事後 ∝ 尤度×事前）。","離散：ベルヌーイ、二項（平均np、分散np(1−p)）、ポアソン（稀な事象の回数）。連続：正規（±1σ≈68%、±2σ≈95%）、指数。","期待値・分散・標準偏差（分散の平方根）、共分散・相関係数（−1〜1、因果ではない）。","大数の法則、中心極限定理（標本平均は正規分布に近づく）。"]},{"h":"推定と情報量","b":["最尤推定（尤度最大化、対数尤度）、MAP推定（事前分布を加味）、ベイズ推定。","自己情報量 −log p、エントロピー（不確実性）、交差エントロピー（分類の損失）、KLダイバージェンス（非対称、0以上）。"]},{"h":"線形代数と微分","b":["行列積 (m×n)(n×p)=(m×p)、転置、逆行列、固有値・固有ベクトル（PCAの主成分方向）、特異値分解。","ノルム：L1（絶対値和）、L2（ユークリッド）。内積とコサイン類似度（−1〜1、1に近いほど似ている）。","微分＝接線の傾き、偏微分・勾配、連鎖律（誤差逆伝播の根拠）。勾配降下法 w ← w − η∇L。","前処理：標準化（平均0・分散1）、min-max正規化（0〜1）、one-hotエンコーディング、対数変換。"]}],"dl":[{"h":"ニューラルネットの基礎","b":["パーセプトロン（ローゼンブラット）。単層はXORが解けない（ミンスキー＆パパート）→多層パーセプトロン。","順伝播で予測、誤差逆伝播（連鎖律）で勾配、勾配降下法で更新。全結合層のパラメータ数＝入力×出力＋出力（バイアス）。","ディープラーニング初期：ヒントンの深層信念ネットワーク（RBMの事前学習）、積層オートエンコーダ。"]},{"h":"活性化関数","b":["シグモイド（0〜1、微分最大0.25→勾配消失）、tanh（−1〜1）、ReLU（正で微分1、死んだReLU）、Leaky ReLU、GELU／Swish。","出力層：二値分類＝シグモイド、多クラス＝ソフトマックス（合計1）、回帰＝恒等関数。"]},{"h":"学習の最適化","b":["バッチ／ミニバッチ／確率的勾配降下法。エポックとイテレーション。","SGD → モーメンタム → AdaGrad → RMSProp → Adam。学習率が大きい＝発散、小さい＝遅い。学習率スケジューリング、ウォームアップ。","局所最適解・鞍点・プラトー。勾配消失（活性化関数・初期化・残差接続で対処）と勾配爆発（勾配クリッピング）。","重み初期化：Xavier（シグモイド・tanh）、He（ReLU）。全て0はNG。"]},{"h":"正則化と汎化","b":["L1／L2正則化（重み減衰）、ドロップアウト（学習時だけランダムに無効化、アンサンブル効果）、早期終了、データ拡張。","バッチ正規化（内部共変量シフト対策、学習を安定・高速化）。レイヤー正規化（Transformer）、インスタンス正規化（スタイル変換）、グループ正規化。","データリーケージに注意（前処理・分割の順序、同一個体の混入）。"]},{"h":"ハードウェアと軽量化","b":["GPU（並列演算）、TPU（Googleのテンソル演算専用）。ハイパーパラメータ探索：グリッド／ランダム／ベイズ最適化。","モデル圧縮：プルーニング（枝刈り）、量子化（低ビット化）、蒸留（教師→生徒）。","説明可能性：LIME（局所線形近似）、SHAP（ゲーム理論）、CAM／Grad-CAM（画像の注目領域）、Attentionの可視化。"]}],"cv":[{"h":"CNNの構成","b":["畳み込み層（フィルタ／カーネル、重み共有、ストライド、パディング）→ 出力サイズ=(入力−カーネル+2P)/S+1。","プーリング層（最大・平均、パラメータなし、位置ずれに頑健）、全結合層、Global Average Pooling（パラメータ削減、CAMに利用）。","生物学的背景：単純型細胞・複雑型細胞 → ネオコグニトロン（福島）→ LeNet（ルカン）。"]},{"h":"代表的なモデル（ILSVRCの系譜）","b":["AlexNet（2012、ReLU・ドロップアウト・GPU）→ VGG（3×3を重ねて深く）→ GoogLeNet（Inception、1×1畳み込み）→ ResNet（残差接続、152層）。","派生：Wide ResNet（幅）、DenseNet（密な接続）、SENet（チャネルAttention）、MobileNet（Depthwise Separable）、EfficientNet（複合スケーリング、NAS）、ViT（パッチをTransformerへ）。","畳み込みの種類：Dilated／Atrous（間隔で受容野拡大）、Depthwise・Pointwise、転置畳み込み（アップサンプリング）。"]},{"h":"タスク別","b":["物体検出：2段階（R-CNN → Fast → Faster：RPN）／1段階（YOLO、SSD：複数スケール）。評価はIoU・mAP。","セグメンテーション：セマンティック（FCN、SegNet、U-Net、DeepLab）／インスタンス（Mask R-CNN）／パノプティック（両者統合）。","その他：姿勢推定（OpenPose）、画像キャプション（CNN＋RNN/Transformer）、3D（NeRF）、画像検索。"]},{"h":"学習の工夫","b":["データ拡張：反転・回転・切り出し・色変換・Cutout／Random Erasing・Mixup・CutMix。ラベルの意味を変えない範囲で。","転移学習（重み固定＋出力層）とファインチューニング（重みも更新）。ImageNet事前学習モデルの活用。","説明可能性：CAM（GAPが必要）、Grad-CAM（勾配利用で汎用）。敵対的サンプルへの脆弱性。"]}],"nlp":[{"h":"前処理と古典的手法","b":["形態素解析（MeCab）、n-gram、Bag-of-Words（語順を失う）、TF-IDF（文書内頻度×希少性）、コサイン類似度。","トピックモデル（LDA）、統計的言語モデル（n-gram）。トークン化：サブワード（BPE、WordPiece、SentencePiece）。"]},{"h":"単語の分散表現","b":["word2vec：CBOW（周辺→中央）、Skip-gram（中央→周辺）。「王−男+女≈女王」。fastText（サブワード）、GloVe（共起統計）。","文脈依存表現：ELMo（双方向LSTM）、BERT。"]},{"h":"系列モデル","b":["RNN（隠れ状態を再帰）→ 勾配消失 → LSTM（記憶セル＋入力・出力・忘却ゲート）、GRU（リセット・更新の2ゲートで軽量）。","双方向RNN、エルマン型（隠れ層をフィードバック）・ジョルダン型（出力をフィードバック）。教師強制（Teacher Forcing）。","Seq2Seq（エンコーダ・デコーダ）→ Attention（固定長ボトルネック解消）→ Transformer（Self-Attention、Multi-Head、位置エンコーディング、再帰なし・並列可）。","Q・K・V：softmax(QKᵀ/√d)V。Source-Target Attentionはデコーダがエンコーダ出力を参照。"]},{"h":"事前学習モデルとLLM","b":["BERT（エンコーダ、MLM＋NSP、双方向）／GPT（デコーダ、自己回帰）／T5（エンコーダ・デコーダ）。","LLM：スケーリング則、In-context learning（Zero/Few-shot）、Chain-of-Thought、指示チューニング、RLHF、RAG、ハルシネーション。","評価：BLEU（翻訳）、ROUGE（要約）、パープレキシティ。"]},{"h":"音声","b":["A/D変換：標本化→量子化→符号化（PCM）。フーリエ変換、スペクトログラム、メル尺度、MFCC。","音声認識：HMM＋GMM → DNN → end-to-end（CTC、Transformer、Whisper）。音声合成：WaveNet（自己回帰、Dilated Conv）。"]}],"gen":[{"h":"生成モデル","b":["GAN（生成器 vs 識別器、モード崩壊、DCGAN・Pix2Pix・CycleGAN・StyleGAN）。","VAE（潜在変数を分布として学習、再構成誤差＋KL、再パラメータ化）、VQ-VAE（潜在変数を離散化）。","拡散モデル（ノイズ除去過程を学習、DDPM）、潜在拡散（Stable Diffusion）、テキスト条件付け（CLIP）、DALL-E。","評価：Inception Score、FID。自己回帰型（PixelCNN、WaveNet、GPT）。フローベースモデル。"]},{"h":"強化学習の基礎","b":["エージェント・環境・状態・行動・報酬・方策。マルコフ決定過程。収益と割引率γ。","価値ベース：状態価値V(s)、行動価値Q(s,a)。Q学習（方策オフ）、SARSA（方策オン）、TD学習、モンテカルロ法。","探索と活用：ε-greedy、UCB。バンディット問題。報酬設計の難しさ（報酬ハッキング、スパースな報酬）。"]},{"h":"深層強化学習","b":["DQN（経験再生、ターゲットネットワーク）→ Double DQN（過大評価の抑制）、Dueling Network（V＋アドバンテージ）、Rainbow。","方策ベース：方策勾配（REINFORCE）、Actor-Critic（A3C）、TRPO／PPO（安定した更新）、連続制御（DDPG、SAC）。","AlphaGo（方策・価値ネットワーク＋MCTS＋自己対戦）→ AlphaGo Zero／AlphaZero（棋譜なし）→ MuZero（ルールも学習）。","Sim2Real、ドメインランダマイゼーション、模倣学習、オフライン強化学習、RLHF（LLMの調整）。"]}],"biz":[{"h":"プロジェクトの進め方","b":["課題定義 → データ確認 → PoC（実現可能性・撤退基準）→ 開発 → 運用・監視。CRISP-DM。AI開発はアジャイル向き。","契約ガイドライン（経産省）：アセスメント→PoC→開発→追加学習の探索的段階型。精度保証は困難、範囲を契約で明確化。","体制：ビジネス側・データサイエンティスト・エンジニア・法務。ステークホルダーとの期待値調整。"]},{"h":"データ","b":["収集：利用規約・著作権・個人情報に配慮。オープンデータのライセンス。サンプリングバイアス。","アノテーション：ガイドライン、複数人の一致度、レビュー。データの分割（時系列は時間順）、リーケージ防止。","前処理：欠損値、外れ値、標準化、特徴量エンジニアリング。まずデータを目で見る（EDA）。"]},{"h":"運用","b":["MLOps：バージョン管理、CI/CD、監視、再学習パイプライン。コンセプトドリフト／データドリフト。A/Bテスト、カナリアリリース。","エッジ vs クラウド：レイテンシ・通信量・プライバシー・計算資源・保守性。軽量化（蒸留・量子化・プルーニング）。","評価指標は業務のコスト構造で選ぶ。説明可能性（XAI）が必要な業務。モデル窃取・敵対的攻撃などのセキュリティ。","AIガバナンス：経営層の関与、AIポリシー、倫理アセスメント、継続的な見直し。OSSライセンスの順守。"]}],"law":[{"h":"個人情報保護法","b":["個人情報（生存する個人、識別可能、個人識別符号）、要配慮個人情報（同意必須、オプトアウト不可）、保有個人データ（開示・訂正・利用停止請求）。","利用目的の特定・通知公表、目的外利用の制限、安全管理措置、第三者提供の制限（同意／オプトアウト／委託・共同利用は例外）。","委託：第三者提供に当たらないが監督義務。越境移転：同意または十分性認定国・相当措置。","匿名加工情報（復元不可、第三者提供可、公表義務）、仮名加工情報（内部分析用、第三者提供不可）。GDPR（域外適用、忘れられる権利）。"]},{"h":"知的財産","b":["著作権法30条の4：情報解析目的の利用は原則許諾不要（利益を不当に害する場合を除く）。生成物は類似性＋依拠性で侵害となりうる。","AI生成物：人の創作的寄与がなければ著作物でない。発明者は自然人（DABUS）。","学習済みモデル・データ：営業秘密（秘密管理・有用・非公知）、限定提供データ（不正競争防止法）。契約で権利帰属と利用条件を定める。"]},{"h":"規制とガイドライン","b":["EU AI Act（リスクベース、禁止／高リスク／限定リスク／最小リスク、域外適用）。","日本：AI事業者ガイドライン（2024、ソフトロー）、人間中心のAI社会原則。OECD AI原則。米国は分野別・州法中心。","自動運転レベル0〜5（レベル3＝条件付き、レベル4＝特定条件下で完全）。独禁法：アルゴリズムによる価格協調。"]},{"h":"倫理","b":["公平性（データの偏り、歴史的バイアス、複数の公平性定義）、透明性・説明責任（相手に応じた説明、営業秘密とのバランス）。","プライバシー・バイ・デザイン（事前的、初期設定、設計に組み込む、可視性・透明性）。","安全性・セキュリティ（敵対的サンプル、モデル窃取、データポイズニング）、ディープフェイク（検知、来歴、法規制）。","AIと労働（リスキリング、モニタリングの事前説明）、環境負荷（学習の電力）、軍事利用・自律兵器の議論。"]}]},"terms":[{"id":"c30ac877","t":"ダートマス会議","d":"1956年、マッカーシーらが開催。「人工知能」という語と研究分野が生まれた。","cat":"ai"},{"id":"f3d21483","t":"エキスパートシステム","d":"専門家の知識をif-thenルールとして蓄え推論する第2次AIブームの中心技術。MYCIN、DENDRALなど。","cat":"ai"},{"id":"8fd13625","t":"知識獲得のボトルネック","d":"専門家の知識を形式化してシステムに入力する作業が困難で、エキスパートシステム普及の壁となった。","cat":"ai"},{"id":"7c080f9b","t":"トイプロブレム","d":"現実の複雑さを取り除いた単純な問題。第1次AIブームで解けたが現実問題には通用しなかった。","cat":"ai"},{"id":"8b2af6a7","t":"フレーム問題","d":"課題に関係のある事柄だけを選び出すことの難しさ。1969年マッカーシーとヘイズが提唱。","cat":"ai"},{"id":"6a6c538d","t":"シンボルグラウンディング問題","d":"記号（言葉）とその意味・実世界の対象を結びつけられるかという問題。記号接地問題。","cat":"ai"},{"id":"97629a40","t":"チューリングテスト","d":"人間が対話相手を機械と見抜けなければ知能があるとみなす判定法。","cat":"ai"},{"id":"c5b33fdd","t":"中国語の部屋","d":"サールの思考実験。規則に従って応答できても理解しているとは言えないという強いAIへの批判。","cat":"ai"},{"id":"4d6fa7b6","t":"AI効果","d":"AIの仕組みが理解されると「単なる自動化で知能ではない」と評価が下がる心理現象。","cat":"ai"},{"id":"3b237621","t":"ELIZA効果","d":"単純な応答をするプログラムに人間らしい意図や感情を感じてしまう心理現象。","cat":"ai"},{"id":"b6fb6ef8","t":"Mini-Max法","d":"自分は最大・相手は最小の評価を選ぶと仮定してゲーム木を探索する手法。αβ法で枝刈りする。","cat":"ai"},{"id":"727bfcc7","t":"モンテカルロ木探索","d":"有望な手からランダムにプレイアウトし、勝率で局面を評価する探索法。囲碁AIで活躍。","cat":"ai"},{"id":"4ddcfde7","t":"オントロジー","d":"概念とその関係を体系的に記述したもの。ヘビーウェイト（厳密）とライトウェイト（半自動）がある。","cat":"ai"},{"id":"e55443ab","t":"シンギュラリティ","d":"AIが自らを改良し技術進歩が予測不能になる転換点。カーツワイルは2045年と予測。","cat":"ai"},{"id":"95a8a761","t":"教師あり学習","d":"入力と正解のペアから、入力→出力の対応を学ぶ。回帰と分類。","cat":"ml"},{"id":"c3424a3d","t":"教師なし学習","d":"正解なしでデータの構造を見つける。クラスタリング、次元削減など。","cat":"ml"},{"id":"934aaf79","t":"ロジスティック回帰","d":"線形結合をシグモイド関数に通して確率を出力する分類モデル。","cat":"ml"},{"id":"51539572","t":"サポートベクターマシン","d":"マージンを最大化する境界を求める分類器。カーネルトリックで非線形にも対応。","cat":"ml"},{"id":"40d9c5b3","t":"ランダムフォレスト","d":"ブートストラップと特徴量のランダム選択で作った多数の決定木の多数決。バギングの代表。","cat":"ml"},{"id":"4c224463","t":"ブースティング","d":"弱学習器を逐次追加し、前の誤りを補正していくアンサンブル。AdaBoost、勾配ブースティング。","cat":"ml"},{"id":"d047eafb","t":"k-means法","d":"重心への割り当てと重心更新を繰り返すクラスタリング。kは事前指定、初期値に依存。","cat":"ml"},{"id":"d9f97bd7","t":"主成分分析","d":"分散が最大になる方向にデータを射影する線形の次元削減。寄与率で成分数を決める。","cat":"ml"},{"id":"079bfc05","t":"t-SNE","d":"高次元データの局所構造を保って2〜3次元に埋め込む可視化手法。","cat":"ml"},{"id":"0b9cac70","t":"交差検証","d":"データの分割を変えて複数回学習・評価し、平均で性能を推定する。k-分割交差検証。","cat":"ml"},{"id":"cef265e9","t":"適合率","d":"陽性と予測したもののうち実際に陽性だった割合。TP/(TP+FP)。誤検知を避けたいときに重視。","cat":"ml"},{"id":"12ce3adb","t":"再現率","d":"実際に陽性のもののうち陽性と予測できた割合。TP/(TP+FN)。見逃しを避けたいときに重視。","cat":"ml"},{"id":"37c62536","t":"F値","d":"適合率と再現率の調和平均。両者のバランスを見る指標。","cat":"ml"},{"id":"95aa692f","t":"AUC","d":"ROC曲線の下の面積。1で完全、0.5でランダムと同等。","cat":"ml"},{"id":"92cbddd2","t":"過学習","d":"学習データに適合しすぎて未知データへの性能が下がる状態。正則化・ドロップアウト・早期終了などで対処。","cat":"ml"},{"id":"af12464b","t":"正則化","d":"損失にパラメータの大きさへのペナルティを加えて過学習を抑える。L1（スパース）とL2。","cat":"ml"},{"id":"ff414f56","t":"ベイズの定理","d":"事後確率 ∝ 尤度 × 事前確率。観測によって信念を更新する枠組み。","cat":"math"},{"id":"bd5f90bd","t":"最尤推定","d":"観測データが得られる確率（尤度）を最大にするパラメータを選ぶ推定法。","cat":"math"},{"id":"451ab8ea","t":"正規分布","d":"平均と標準偏差で決まる釣鐘型の分布。±1σに約68%、±2σに約95%。","cat":"math"},{"id":"f747ef3c","t":"二項分布","d":"成功確率pの試行をn回行ったときの成功回数の分布。平均np、分散np(1−p)。","cat":"math"},{"id":"37a567b8","t":"中心極限定理","d":"母集団の分布によらず、標本平均の分布は正規分布に近づく。","cat":"math"},{"id":"fd92c27d","t":"相関係数","d":"2変数の線形関係の強さ（−1〜1）。相関は因果を意味しない。","cat":"math"},{"id":"f10bd8be","t":"エントロピー","d":"確率分布の不確実性の大きさ。情報量 −log p の期待値。","cat":"math"},{"id":"285d8674","t":"KLダイバージェンス","d":"2つの確率分布の違いの尺度。非対称で0以上。VAEの損失などに使う。","cat":"math"},{"id":"6465f3f4","t":"固有ベクトル","d":"行列をかけても向きが変わらないベクトル。共分散行列の固有ベクトルがPCAの主成分方向。","cat":"math"},{"id":"0b76c6bb","t":"連鎖律","d":"合成関数の微分は各段の微分の積。誤差逆伝播法の数学的基礎。","cat":"math"},{"id":"d53e25fc","t":"多層パーセプトロン","d":"入力層・隠れ層・出力層からなる順伝播型ニューラルネットワーク。","cat":"dl"},{"id":"f6a9206a","t":"誤差逆伝播法","d":"出力の誤差を連鎖律で入力側へ伝え、各重みの勾配を効率よく計算する方法。","cat":"dl"},{"id":"5ab1fec8","t":"勾配消失問題","d":"深い層で勾配が小さくなり学習が進まなくなる問題。ReLU、適切な初期化、残差接続などで対処。","cat":"dl"},{"id":"dd10d919","t":"ReLU","d":"max(0, x)。正の領域で勾配が1のため勾配消失しにくく、計算も軽い。","cat":"dl"},{"id":"0e585eb3","t":"ソフトマックス関数","d":"多クラス分類の出力層で使う。各クラスの確率を出力し合計は1。","cat":"dl"},{"id":"3610fdcf","t":"確率的勾配降下法","d":"データの一部（ミニバッチ）で勾配を計算して更新する最適化。SGD。","cat":"dl"},{"id":"7efd721c","t":"Adam","d":"モーメンタムと勾配の二乗の移動平均による学習率調整を組み合わせた最適化手法。","cat":"dl"},{"id":"e18c0cc9","t":"ドロップアウト","d":"学習時にランダムにニューロンを無効化する正則化。アンサンブルのような効果。","cat":"dl"},{"id":"3fc9c019","t":"バッチ正規化","d":"各層の出力をミニバッチ単位で正規化し、学習を安定・高速化する。内部共変量シフト対策。","cat":"dl"},{"id":"c1c3b3e6","t":"早期終了","d":"検証誤差が悪化し始めた時点で学習を止める過学習対策。","cat":"dl"},{"id":"3fc86555","t":"Xavier / He の初期値","d":"活性化関数に合わせて重みの初期分散を決める方法。Xavierはシグモイド・tanh、HeはReLU向け。","cat":"dl"},{"id":"4b02869a","t":"オートエンコーダ","d":"入力を再現するように学習し、中間層に圧縮表現を得るネットワーク。","cat":"dl"},{"id":"8dbf27c6","t":"データリーケージ","d":"テストや未来の情報が学習に混入し、評価が不当に高くなる問題。","cat":"dl"},{"id":"18d94f7d","t":"蒸留","d":"大きな教師モデルの出力を目標に小さな生徒モデルを学習させる軽量化手法。","cat":"dl"},{"id":"911ec5a1","t":"量子化","d":"重みや活性を低ビット表現に変換してモデルを軽量化・高速化する。","cat":"dl"},{"id":"8deb7215","t":"プルーニング","d":"重要度の低い結合やニューロンを削除してモデルを軽量化する。枝刈り。","cat":"dl"},{"id":"2cf3a296","t":"LIME","d":"説明したい予測の周辺を解釈可能な線形モデルで局所近似して説明する手法。","cat":"dl"},{"id":"46affd01","t":"SHAP","d":"ゲーム理論のシャープレイ値に基づき各特徴量の貢献度を算出する説明手法。","cat":"dl"},{"id":"6f731058","t":"畳み込み層","d":"フィルタを画像上でずらして適用し局所特徴を抽出する層。重み共有でパラメータが少ない。","cat":"cv"},{"id":"505123d6","t":"プーリング層","d":"特徴マップを縮小する層。最大値・平均値。パラメータを持たず位置ずれに頑健。","cat":"cv"},{"id":"d33258dc","t":"パディング","d":"画像の周囲を0などで埋めて端の情報を保ち、出力サイズを調整する処理。","cat":"cv"},{"id":"3c184757","t":"Global Average Pooling","d":"特徴マップごとの平均を取り全結合層を置き換える。パラメータ削減、CAMに利用。","cat":"cv"},{"id":"cdebdc3c","t":"AlexNet","d":"2012年ILSVRC優勝。ReLU、ドロップアウト、GPU学習でディープラーニングの威力を示した。","cat":"cv"},{"id":"1036fd1a","t":"VGG","d":"3×3の小さなフィルタを重ねて深くしたシンプルなCNN。","cat":"cv"},{"id":"028c6b2b","t":"GoogLeNet","d":"複数サイズの畳み込みを並列に行うInceptionモジュールを積層したCNN。","cat":"cv"},{"id":"cefb8aa8","t":"ResNet","d":"残差接続（スキップ結合）で勾配を伝えやすくし、152層の学習を可能にしたCNN。","cat":"cv"},{"id":"23c19dff","t":"MobileNet","d":"Depthwise Separable Convolutionで計算量を大幅に減らしたモバイル向けCNN。","cat":"cv"},{"id":"4a50551b","t":"EfficientNet","d":"深さ・幅・解像度を複合的にスケーリングし、少ないパラメータで高精度を達成したCNN。","cat":"cv"},{"id":"6fa3e69a","t":"Dilated Convolution","d":"カーネルの要素に間隔を空け、パラメータを増やさず受容野を広げる畳み込み。Atrous Convolution。","cat":"cv"},{"id":"000d2f8d","t":"Faster R-CNN","d":"RPNで候補領域を生成してから分類する2段階の物体検出モデル。","cat":"cv"},{"id":"2d664feb","t":"YOLO","d":"画像を一度見るだけで位置とクラスを予測する1段階の高速な物体検出モデル。","cat":"cv"},{"id":"34df20ba","t":"SSD","d":"複数スケールの特徴マップから検出する1段階の物体検出モデル。","cat":"cv"},{"id":"9ce309ef","t":"セマンティックセグメンテーション","d":"画素ごとにクラスを割り当てる。同クラスの個体は区別しない。FCN、U-Net、DeepLab。","cat":"cv"},{"id":"e5e244da","t":"インスタンスセグメンテーション","d":"画素ごとにクラスを割り当て、同クラスでも個体を区別する。Mask R-CNN。","cat":"cv"},{"id":"86839fde","t":"パノプティックセグメンテーション","d":"セマンティックとインスタンスを統合し、背景も含めて全画素を扱うタスク。","cat":"cv"},{"id":"78d155ce","t":"U-Net","d":"対称なエンコーダ・デコーダとスキップ接続を持つセグメンテーションモデル。医用画像で提案。","cat":"cv"},{"id":"5289409f","t":"IoU","d":"予測領域と正解領域の共通部分／和集合。物体検出やセグメンテーションの評価指標。","cat":"cv"},{"id":"5fdbce6a","t":"データ拡張","d":"反転・回転・切り出し・色変換などで学習データを擬似的に増やす。Cutout、Mixup、CutMixなど。","cat":"cv"},{"id":"29989c0b","t":"転移学習","d":"学習済みモデルの重みを固定し出力層だけを新タスク用に学習する方法。","cat":"cv"},{"id":"e2bb960e","t":"ファインチューニング","d":"学習済みモデルの重みも含めて新タスク向けに再学習する方法。","cat":"cv"},{"id":"f91a57ab","t":"Grad-CAM","d":"最終畳み込み層の勾配を用いて予測の根拠となる領域をヒートマップ表示する手法。","cat":"cv"},{"id":"1411ae3f","t":"Vision Transformer","d":"画像をパッチに分割しトークンとしてTransformerで処理するモデル。ViT。","cat":"cv"},{"id":"f6780541","t":"形態素解析","d":"文を意味の最小単位に分割し品詞を付与する処理。日本語処理の前段。","cat":"nlp"},{"id":"72f8ed33","t":"TF-IDF","d":"文書内での頻度と全文書での希少性を掛け合わせた単語の重要度。","cat":"nlp"},{"id":"61963778","t":"word2vec","d":"単語の分散表現を学ぶ手法。CBOW（周辺→中央）とSkip-gram（中央→周辺）。","cat":"nlp"},{"id":"92cb4436","t":"分散表現","d":"単語や文を意味を反映した密なベクトルで表したもの。加減算で意味関係を表せる。","cat":"nlp"},{"id":"eca9158c","t":"LSTM","d":"記憶セルと3つのゲートで長期依存を扱えるようにしたRNN。","cat":"nlp"},{"id":"d4498e45","t":"GRU","d":"リセットゲートと更新ゲートの2つでLSTMを簡略化したRNN。","cat":"nlp"},{"id":"a650c2f2","t":"Seq2Seq","d":"エンコーダで入力系列をベクトル化し、デコーダで出力系列を生成するモデル。","cat":"nlp"},{"id":"2aa97e44","t":"Attention","d":"出力の各ステップで入力のどこに注目するかを重み付けする仕組み。","cat":"nlp"},{"id":"bbca2718","t":"Transformer","d":"再帰を使わずSelf-Attentionのみで系列を処理するモデル。並列化しやすく大規模化の基盤。","cat":"nlp"},{"id":"a8c0423f","t":"Self-Attention","d":"同じ系列内の要素同士の関連度を計算する注意機構。Q・K・Vを用いる。","cat":"nlp"},{"id":"ff3bf54d","t":"位置エンコーディング","d":"再帰を持たないTransformerに単語の順序情報を与える仕組み。","cat":"nlp"},{"id":"221c3eff","t":"BERT","d":"Transformerエンコーダを双方向に用い、マスク単語予測と次文予測で事前学習したモデル。","cat":"nlp"},{"id":"1703f91c","t":"GPT","d":"Transformerデコーダで次の単語を予測する自己回帰型の大規模言語モデル。","cat":"nlp"},{"id":"80185c43","t":"ELMo","d":"双方向LSTMによる文脈依存の単語表現。BERTに先行。","cat":"nlp"},{"id":"d46c47b2","t":"スケーリング則","d":"パラメータ・データ・計算量を増やすと性能がべき乗則で改善するという経験則。","cat":"nlp"},{"id":"fb6a72bb","t":"RAG","d":"外部文書を検索して文脈として与え、根拠に基づいて生成する手法。ハルシネーション対策。","cat":"nlp"},{"id":"f605e937","t":"ハルシネーション","d":"言語モデルが事実と異なる内容をもっともらしく生成する現象。","cat":"nlp"},{"id":"0645f949","t":"RLHF","d":"人間の選好ランキングから報酬モデルを学び、強化学習で言語モデルを調整する手法。","cat":"nlp"},{"id":"25cea5d1","t":"MFCC","d":"メル尺度に基づく音声の特徴量。古典的な音声認識の標準的入力。","cat":"nlp"},{"id":"9614a480","t":"WaveNet","d":"Dilated Convolutionで音声波形を自己回帰的に生成する音声合成モデル。","cat":"nlp"},{"id":"787700a5","t":"GAN","d":"生成器と識別器を競わせて学習する生成モデル。モード崩壊が課題。","cat":"gen"},{"id":"a9423d60","t":"VAE","d":"潜在変数を確率分布として学習する生成モデル。再構成誤差＋KLダイバージェンス。","cat":"gen"},{"id":"7d526d51","t":"拡散モデル","d":"ノイズを段階的に除去する過程を学習して生成するモデル。Stable Diffusionの基盤。","cat":"gen"},{"id":"960f0b6c","t":"CLIP","d":"画像とテキストを対比学習で共通空間に対応付けたモデル。ゼロショット分類や生成の条件付けに利用。","cat":"gen"},{"id":"1f6033bb","t":"Q学習","d":"行動価値Q(s,a)を更新して最適方策を学ぶ方策オフ型の強化学習。","cat":"gen"},{"id":"3974e91c","t":"割引率","d":"将来の報酬をどれだけ重視するかを決める係数γ（0〜1）。","cat":"gen"},{"id":"a0813677","t":"ε-greedy","d":"確率εで探索（ランダム）、それ以外は活用（最大価値の行動）を選ぶ方策。","cat":"gen"},{"id":"618c75d6","t":"DQN","d":"Q関数をディープニューラルネットで近似。経験再生とターゲットネットワークで安定化。","cat":"gen"},{"id":"3acc4c26","t":"方策勾配法","d":"方策をパラメータ化し期待収益の勾配で直接更新する強化学習。","cat":"gen"},{"id":"8c343139","t":"Actor-Critic","d":"方策（Actor）と価値関数（Critic）を同時に学習する手法。","cat":"gen"},{"id":"275d8e2f","t":"AlphaGo","d":"方策・価値ネットワークとモンテカルロ木探索を組み合わせ、2016年にプロ棋士に勝った囲碁AI。","cat":"gen"},{"id":"9a0fdca1","t":"報酬ハッキング","d":"エージェントが設計者の意図と異なる方法で報酬を最大化してしまう現象。","cat":"gen"},{"id":"816794d0","t":"PoC","d":"概念実証。本開発前に技術的な実現可能性と効果を小規模に検証する段階。","cat":"biz"},{"id":"65fe3452","t":"CRISP-DM","d":"ビジネス理解→データ理解→データ準備→モデリング→評価→展開の標準プロセス。","cat":"biz"},{"id":"895a85fc","t":"MLOps","d":"機械学習の開発と運用を統合し、継続的な学習・デプロイ・監視を効率化する取り組み。","cat":"biz"},{"id":"eb4a9d6a","t":"コンセプトドリフト","d":"運用中に入力と正解の関係が変化し、モデルの精度が低下する現象。","cat":"biz"},{"id":"0c60b11c","t":"アノテーション","d":"学習データに正解ラベルを付ける作業。ガイドラインとレビューで品質を担保。","cat":"biz"},{"id":"26c074a2","t":"サンプリングバイアス","d":"収集したデータが母集団を代表していない偏り。","cat":"biz"},{"id":"b6fbd305","t":"エッジAI","d":"端末側でAIの推論を行う方式。低遅延・通信量削減・プライバシーに有利、計算資源は限られる。","cat":"biz"},{"id":"fa64f98b","t":"A/Bテスト","d":"利用者をランダムに2群に分けて施策やモデルの効果を比較する検証法。","cat":"biz"},{"id":"88713f23","t":"探索的段階型契約","d":"アセスメント→PoC→開発→追加学習と段階を分けて契約するAI開発の進め方。","cat":"biz"},{"id":"31378e01","t":"個人情報","d":"生存する個人に関する情報で特定の個人を識別できるもの。個人識別符号を含む。","cat":"law"},{"id":"b7d128b2","t":"要配慮個人情報","d":"人種・信条・病歴・犯罪歴など。取得に原則本人同意が必要でオプトアウト提供不可。","cat":"law"},{"id":"6c9fb0c4","t":"匿名加工情報","d":"個人を識別できず復元もできないよう加工した情報。条件付きで同意なく第三者提供可。","cat":"law"},{"id":"99d99be8","t":"仮名加工情報","d":"他の情報と照合しなければ識別できないよう加工した情報。内部分析用で第三者提供は原則不可。","cat":"law"},{"id":"74394caa","t":"著作権法30条の4","d":"情報解析など享受目的でない利用は、著作権者の利益を不当に害しない限り許諾不要とする規定。","cat":"law"},{"id":"3188c138","t":"営業秘密","d":"秘密管理性・有用性・非公知性を満たす情報。不正競争防止法で保護。学習済みモデルの保護手段。","cat":"law"},{"id":"1c0f6ef4","t":"限定提供データ","d":"特定の者に業として提供する電磁的に管理された相当量のデータ。不正競争防止法で保護。","cat":"law"},{"id":"3406d9b8","t":"EU AI Act","d":"AIをリスクで分類し、禁止・高リスク・限定・最小の段階で義務を課すEUの規制法。","cat":"law"},{"id":"4e94c8ad","t":"GDPR","d":"EUの一般データ保護規則。域外適用、忘れられる権利、高額な制裁金が特徴。","cat":"law"},{"id":"cc6a761e","t":"AI事業者ガイドライン","d":"2024年に総務省・経産省が示した開発者・提供者・利用者向けの指針。法的拘束力はない。","cat":"law"},{"id":"18e2710a","t":"プライバシー・バイ・デザイン","d":"企画・設計段階からプライバシー保護を組み込む考え方。7つの原則。","cat":"law"},{"id":"6bf60192","t":"アカウンタビリティ","d":"AIの判断や影響について関係者に説明し責任を負う体制。説明責任。","cat":"law"},{"id":"f6ea4859","t":"敵対的サンプル","d":"微小なノイズでモデルを誤らせる入力。セキュリティ上のリスク。","cat":"law"},{"id":"4c82638a","t":"ディープフェイク","d":"AIで生成・改変した本物そっくりの偽画像・動画・音声。検知技術や来歴証明で対策。","cat":"law"},{"id":"17e635c1","t":"自動運転レベル3","d":"特定条件下でシステムが運転するが、要請時には人間が引き継ぐ段階。","cat":"law"}],"trend":{"exam":"第4回 G検定（2026年7月4日実施）を分析","share":[{"cat":"cv","pct":18},{"cat":"ml","pct":12},{"cat":"math","pct":4},{"cat":"nlp","pct":14},{"cat":"law","pct":14},{"cat":"biz","pct":13},{"cat":"dl","pct":12},{"cat":"gen","pct":8},{"cat":"ai","pct":4}],"formats":[{"name":"「最も不適切なもの」を選ぶ問題","pct":32},{"name":"空欄（A）（B）を埋める組み合わせ問題","pct":11},{"name":"「あなたは…プロジェクトに参加している」型のシナリオ問題","pct":7}],"themes":["正則化（L1/L2）とバイアス・バリアンスの関係","CNNの派生技術の区別（Dilated／Depthwise Separable／GAP／SENet／ResNet系）","物体検出・セグメンテーション系モデルの整理（R-CNN系、YOLO、SSD、DeepLab、パノプティック）","Transformer／BERT／ELMo／GPT の構造と学習方法の違い","RNNの派生（LSTM／GRU、エルマン型／ジョルダン型、Attention）","生成モデル（VAE／VQ-VAE／DCGAN／拡散モデル／Stable Diffusion）","DQNの拡張（Double DQN、Dueling Network）とQ値・状態価値・行動価値","個人情報保護法（要配慮個人情報、委託、開示請求、越境移転）","生成AIと著作権（依拠性・類似性、著作者の判断、開発委託契約の納品物）","プライバシー・バイ・デザイン、透明性、AIポリシー、ソフトロー","PoCと精度保証、エッジ vs クラウド、MLOps、アジャイル","評価指標の選択（適合率・再現率をコスト構造から選ぶ）","軽量化（プルーニング・量子化・蒸留）、データ拡張（Cutout など）","統計の基礎（二項分布、最尤法、次元の呪い、コサイン類似度）"],"mock":{"n":30,"minutes":22,"weights":{"cv":5,"ml":3,"math":2,"nlp":4,"law":4,"biz":4,"dl":4,"gen":3,"ai":1}}},"built":"2026-09-11"};</script>

  const id = fc.order[fc.i]; const t = id && DATA.terms.find(x => x.id === id);
  const got = DATA.terms.filter(x => S.terms[x.id] === 2).length;
  return '<div class="page-h"><div><div class="eyebrow">Flashcards</div><h1>用語カード</h1><p>用語を見て説明を思い出してから答えを表示。「覚えた」にした用語は次回から出ません。</p></div><a class="btn ghost" href="#/terms">一覧に戻る</a></div>' +
    '<div class="ttools" style="grid-template-columns:220px 1fr auto"><select class="sel" id="fccat"><option value="">すべての分野</option>' + CATS.map(c => '<option value="' + c.id + '"' + (termCat===c.id?' selected':'') + '>' + esc(c.name) + '</option>').join('') + '</select><span class="muted" style="align-self:center">覚えた <b class="num">' + got + '</b> / ' + DATA.terms.length + '</span><button class="btn sm" data-act="fc-reset">「覚えた」をリセット</button></div>' +
    (t ? '<div class="fc"><div class="card fcard"><div class="t"><div class="eyebrow">' + esc(CAT[t.cat]) + '</div><h2>' + esc(t.t) + '</h2></div><div class="d' + (fc.open ? '' : ' hide') + '" id="fcd">' + esc(t.d) + '</div></div>' +
      '<div class="fc-actions"><button class="btn still" data-act="fc-still">まだ <span class="kbd">1</span></button><button class="btn" data-act="fc-flip">' + (fc.open ? '隠す' : '答えを見る') + ' <span class="kbd">Space</span></button><button class="btn got" data-act="fc-got">覚えた <span class="kbd">2</span></button></div>' +
      '<div class="fc-nav"><span class="num">' + (fc.i+1) + ' / ' + fc.order.length + '</span><span>残り ' + (fc.order.length - fc.i - 1) + ' 語</span></div></div>'
    : '<div class="card empty">この分野の用語はすべて「覚えた」になっています。</div>');
}

/* ---------- render & events ---------- */
function render(){
  renderNav();
  const r = route(); const main = $('#main');
  document.body.dataset.view = r.top || 'home';
  if (r.top === 'practice') main.innerHTML = viewPractice(r.a, r.b);
  else if (r.top === 'mock') main.innerHTML = viewMock(r.a);
  else if (r.top === 'notes') main.innerHTML = viewNotes(r.a);
  else if (r.top === 'terms') main.innerHTML = viewTerms(r.a, r.b);
  else main.innerHTML = viewHome();
  $('#ftr').innerHTML = 'G検定 模試ラボ — 問題・解説・要点・用語はすべて本サイトのオリジナルです（AIが作成し、公式試験問題や市販書籍の転載は含みません）。内容は' + esc(DATA.built) + '時点の知識に基づき、法令や制度は変更される場合があります。最終的な確認は JDLA のシラバスと一次情報で行ってください。学習記録はこのブラウザ内にのみ保存されます。';
}
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]'); if (go){ location.hash = go.dataset.go; return; }
  const reset = e.target.closest('[data-reset]'); if (reset){ run = null; }
  const pk = e.target.closest('[data-pick]'); if (pk && !pk.disabled){ pick(parseInt(pk.dataset.pick, 10)); return; }
  const act = e.target.closest('[data-act]'); if (!act) return;
  const a = act.dataset.act;
  if (a === 'next'){ run.i++; render(); window.scrollTo(0,0); }
  else if (a === 'prev'){ if (run.i > 0){ run.i--; render(); window.scrollTo(0,0); } }
  else if (a === 'finish'){ finishMock(); render(); window.scrollTo(0,0); }
  else if (a === 'retry-wrong'){ const wrong = run.list.filter(id => run.picked[id] !== QI[id].a); run = { kind:'practice', list: wrong, i:0, picked:{}, title:'間違えた問題をもう一度' }; render(); window.scrollTo(0,0); }
  else if (a === 'fc-flip'){ fc.open = !fc.open; render(); }
  else if (a === 'fc-still' || a === 'fc-got'){ const id = fc.order[fc.i]; if (!id) return; S.terms[id] = a === 'fc-got' ? 2 : 1; save(); fc.order.splice(fc.i, 1); if (fc.i >= fc.order.length) fc.i = 0; fc.open = false; render(); }
  else if (a === 'fc-reset'){ DATA.terms.forEach(t => { delete S.terms[t.id]; }); save(); fcRebuild(); render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'termq'){ termQ = e.target.value; const pos = e.target.selectionStart; render(); const el = $('#termq'); if (el){ el.focus(); try { el.setSelectionRange(pos, pos); } catch(x){} } }
});
document.addEventListener('change', e => {
  if (e.target.id === 'termcat'){ termCat = e.target.value; render(); }
  else if (e.target.id === 'fccat'){ termCat = e.target.value; fcRebuild(); render(); }
  else if (e.target.id === 'nsel'){ location.hash = '#/notes/' + e.target.value; }
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  const v = document.body.dataset.view;
  if ((v === 'practice' || v === 'mock') && run && !run.done){
    if (/^[1-4]$/.test(e.key)){ const id = run.list[run.i]; if (run.kind === 'mock' || run.picked[id] == null) pick(parseInt(e.key, 10) - 1); }
    else if ((e.key === 'Enter' || e.key === 'ArrowRight') && run.i + 1 < run.list.length && (run.kind === 'mock' || run.picked[run.list[run.i]] != null)){ run.i++; render(); window.scrollTo(0,0); }
    else if (e.key === 'ArrowLeft' && run.kind === 'mock' && run.i > 0){ run.i--; render(); }
  } else if (v === 'terms' && route().a === 'cards' && fc.order.length){
    if (e.key === ' '){ e.preventDefault(); fc.open = !fc.open; render(); }
    else if (e.key === '1' || e.key === '2'){ const id = fc.order[fc.i]; if (id){ S.terms[id] = e.key === '2' ? 2 : 1; save(); fc.order.splice(fc.i, 1); if (fc.i >= fc.order.length) fc.i = 0; fc.open = false; render(); } }
  }
});
render();
})();
</script>
