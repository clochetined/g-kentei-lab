name: Deploy Site (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build
        env:
          # リポジトリの Variables に GK_API_BASE（本番 API の URL）を設定すると、
          # サイトが結果の集計・同期機能を有効にする。未設定なら API なしで動く。
          GK_API_BASE: ${{ vars.GK_API_BASE }}
        run: |
          python src/build_pub.py
          python src/make_standalone.py --out dist/index.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
