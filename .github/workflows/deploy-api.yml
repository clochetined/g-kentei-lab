name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "デプロイ先"
        type: choice
        options: [staging, prod]
        default: staging

permissions:
  id-token: write   # OIDC で AWS ロールを引き受ける
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && pytest

  deploy-staging:
    name: deploy → staging
    needs: test
    # リポジトリ変数 AWS_DEPLOY_ENABLED=true を設定するまでデプロイはスキップ（AWS 未設定でも CI を赤くしない）
    if: vars.AWS_DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || inputs.target == 'staging')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.out.outputs.api_url }}
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: sam build
      - run: sam deploy --config-env staging --region ${{ env.AWS_REGION }}
      - id: out
        name: stack outputs
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name g-kentei-lab-api-staging \
                --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          echo "api_url=$URL" >> "$GITHUB_OUTPUT"
          echo "API: $URL" >> "$GITHUB_STEP_SUMMARY"
      - name: smoke test
        run: |
          curl -fsS "${{ steps.out.outputs.api_url }}/v1/health" | grep -q '"ok": true'
          curl -fsS "${{ steps.out.outputs.api_url }}/v1/stats" | grep -q '"global"'

  deploy-prod:
    name: deploy → production
    needs: deploy-staging
    if: vars.AWS_DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || inputs.target == 'prod')
    runs-on: ubuntu-latest
    environment:
      name: production    # GitHub 側で「Required reviewers」を設定すると手動承認になる
      url: ${{ steps.out.outputs.api_url }}
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: sam build
      - run: sam deploy --config-env prod --region ${{ env.AWS_REGION }}
      - id: out
        name: stack outputs
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name g-kentei-lab-api-prod \
                --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          echo "api_url=$URL" >> "$GITHUB_OUTPUT"
          echo "API: $URL" >> "$GITHUB_STEP_SUMMARY"
      - name: smoke test
        run: curl -fsS "${{ steps.out.outputs.api_url }}/v1/health" | grep -q '"ok": true'
